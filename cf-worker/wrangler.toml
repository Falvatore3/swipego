name = "swipego-deepseek-proxy"
main = "src/index.js"
compatibility_date = "2025-01-01"

# 部署后的 Worker 默认 URL：
#   https://swipego-deepseek-proxy.<你的-cf-子域>.workers.dev
#
# 如果你想要自定义路由 / 自定义域名，再在下面加 [routes] 配置即可。
# 默认部署到 workers.dev 子域，前端直接调用这个 URL 就行。

# ----------------------------------------------------------------------
# 允许的前端来源（Origin 白名单），通过 vars 注入到 Worker 里
# 多个值用英文逗号分隔，不要有空格
# ----------------------------------------------------------------------
[vars]
ALLOWED_ORIGINS = "https://falvatore3.github.io,http://localhost:3000,http://localhost:5173,http://localhost:8080,http://127.0.0.1:3000,http://127.0.0.1:5173,http://127.0.0.1:8080"

# DeepSeek 上游 API 地址（可改，默认官方）
DEEPSEEK_UPSTREAM = "https://api.deepseek.com/chat/completions"

# 单 IP 每分钟最多请求数（简易内存级限流，仅作为兜底）
RATE_LIMIT_PER_MIN = "20"

# 请求 body 最大字节数（10 KB）
MAX_BODY_BYTES = "10240"

# ----------------------------------------------------------------------
# DEEPSEEK_KEY 不在这里写！
# 用 `wrangler secret put DEEPSEEK_KEY` 注入，详见 README。
# ----------------------------------------------------------------------

# 可选：观测性（出问题时方便在 CF Dashboard 看日志）
[observability]
enabled = true

# ----------------------------------------------------------------------
# KV 存储：用来收手机端上传的调试日志
# 步骤：
#   1. CF Dashboard → Workers & Pages → KV → Create namespace
#   2. 名字写 swipego-logs
#   3. 创建后会有一个 Namespace ID（一长串字母数字）
#   4. 把下面 id 的 "REPLACE_WITH_KV_ID" 替换成那个 ID
#   5. 重新 wrangler deploy 即可
# ----------------------------------------------------------------------
[[kv_namespaces]]
binding = "LOGS"
id = "REPLACE_WITH_KV_ID"

# 调试日志的访问 token（防止陌生人 GET 你的日志）
# 用 `wrangler secret put DEBUG_TOKEN` 设置一个随机字符串
# 拉取时带 ?token=xxx 才能看到日志
