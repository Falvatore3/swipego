<style>
  :root{
    --ink:#0F3D2E;        /* 深墨绿 */
    --ink-2:#1A5240;
    --cream:#FAF7F0;      /* 奶油白 */
    --paper:#F2EDE0;
    --accent:#FF6B35;     /* 曼谷橙 */
    --line:#D9D2BF;
    --muted:#6B7A70;
  }
  html,body{background:var(--cream);color:var(--ink);font-family:Inter,'Noto Serif SC',system-ui,sans-serif;}
  .font-serif{font-family:'Noto Serif SC',serif;letter-spacing:.02em;}
  .font-mono{font-family:'JetBrains Mono',ui-monospace,monospace;}
  .bg-ink{background:var(--ink);} .text-ink{color:var(--ink);}
  .bg-cream{background:var(--cream);} .bg-paper{background:var(--paper);}
  .border-line{border-color:var(--line);}
  .text-accent{color:var(--accent);} .bg-accent{background:var(--accent);}
  .text-muted{color:var(--muted);}
  /* 网格纸背景，强化"清单"感 */
  .grid-paper{
    background-image:
      linear-gradient(var(--line) 1px,transparent 1px),
      linear-gradient(90deg,var(--line) 1px,transparent 1px);
    background-size: 32px 32px;
    background-color:var(--cream);
    opacity:.35;
  }
  /* 滑动卡阴影 */
  .card-shadow{box-shadow:0 1px 0 rgba(15,61,46,.08),0 20px 40px -16px rgba(15,61,46,.35);}
  /* 打勾动画 */
  @keyframes tickIn{from{transform:scale(.2) rotate(-20deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
  .tick-in{animation:tickIn .3s cubic-bezier(.2,.8,.2,1);}
  /* 隐藏滚动条 */
  .no-scrollbar::-webkit-scrollbar{display:none}
  .no-scrollbar{-ms-overflow-style:none;scrollbar-width:none}
  /* 时间轴点 */
  .dot{width:10px;height:10px;border-radius:9999px;background:var(--ink);box-shadow:0 0 0 3px var(--cream),0 0 0 4px var(--ink);}
  .btn-primary{background:var(--ink);color:var(--cream);}
  .btn-primary:hover{background:var(--ink-2);}
  /* 详情抽屉动画 */
  @keyframes sheetFade{from{opacity:0}to{opacity:1}}
  @keyframes sheetUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
  .sheet-fade{animation:sheetFade .25s ease-out}
  .sheet-up{animation:sheetUp .32s cubic-bezier(.2,.8,.2,1)}
  /* safe area */
  .pb-safe{padding-bottom:calc(env(safe-area-inset-bottom,0) + 1rem);}
  .pt-safe{padding-top:calc(env(safe-area-inset-top,0) + 1rem);}
</style>

<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef, useCallback } = React;

/* ---------- 数据加载 ---------- */
function usePois(){
  const [data,setData] = useState(null);
  const [err,setErr] = useState(null);
  useEffect(()=>{
    fetch('./data/bangkok-pois.json?v='+Date.now())
      .then(r=>{ if(!r.ok) throw new Error('poi 数据还没就绪，研究 Agent 正在整理'); return r.json(); })
      .then(setData)
      .catch(e=>setErr(e.message));
  },[]);
  return {data,err};
}

/* ---------- 小工具 ---------- */
const CAT_META = {
  landmark:   {label:'地标寺庙', icon:'🏛'},
  restaurant: {label:'特色餐厅', icon:'🍽'},
  streetfood: {label:'街边小吃', icon:'🥘'},
  cafe:       {label:'咖啡甜品', icon:'☕'},
  market:     {label:'市集购物', icon:'🛍'},
  mall:       {label:'商场',     icon:'🏬'},
  nightlife:  {label:'夜生活',   icon:'🌃'},
  spa:        {label:'SPA体验',  icon:'💆'},
  art:        {label:'文艺艺术', icon:'🎨'},
  family:     {label:'亲子游乐', icon:'🦁'},
  hidden:     {label:'小众秘境', icon:'🗺'},
  // 兼容旧数据
  food:       {label:'美食',     icon:'🍜'},
  niche:      {label:'小众文艺', icon:'🛕'},
  nature:     {label:'自然公园', icon:'🌳'},
};
// "吃饭"类（用于固定节奏插入）
const MEAL_CATS = new Set(['restaurant','streetfood']);
// "甜品/咖啡"算辅助餐饮但不算正餐
const SNACK_CATS = new Set(['cafe']);
const TIME_META = {
  morning:{label:'清晨',range:'06-11'},
  noon:{label:'午间',range:'11-14'},
  afternoon:{label:'午后',range:'14-17'},
  evening:{label:'傍晚',range:'17-20'},
  night:{label:'夜间',range:'20-24'},
};

/* ---------- 智能推荐引擎 ---------- */
/*
 * 策略：
 *  1) 冷启动：前 8 张优先 popularity ≥ 8 的高分热门，强制每张换品类
 *  2) 自适应：第 9 张起按 score 公式抽：
 *       score = popularity 基础分
 *             + 用户兴趣加成 (该 category 用户右滑越多越加分)
 *             - 近期连发惩罚 (上 3 张里同 category 几张就 -几 × 8)
 *             + 探索奖励 (用户没看过的 category +3)
 *             + 随机抖动 ±2
 *  3) 餐饮独立节奏：每 5 张必塞 1 张吃的（非个性化，固定刚需）
 *  4) 已看过的 POI 不再出现
 */
function createRecommender(allPois){
  const seen = new Set();         // 已抽过的 poi.id
  const recent = [];              // 最近抽过的 category，最长 5
  const tasteCount = {};          // category -> 用户右滑次数（用于 exploit）
  const seenCount = {};           // category -> 已展示次数（用于 explore）
  let total = 0;                  // 已抽过的卡数

  // 把"非餐饮"和"餐饮"分开池
  const isMeal = (p)=> MEAL_CATS.has(p.category);

  const computeScore = (p, opts={})=>{
    const cat = p.category;
    const pop = p.popularity || 5;
    let score = pop;

    if(opts.coldStart){
      // 冷启动：只看热门，强惩同品类
      const sameInRecent = recent.filter(c=>c===cat).length;
      score += -sameInRecent * 12;
      score += pop >= 8 ? 5 : 0;
      score += (Math.random()-0.5) * 3;
      return score;
    }

    // 用户兴趣（exploit）— 包含餐饮，全部品类都参与个性化
    const interest = (tasteCount[cat]||0);
    score += interest * 1.8;
    // 同品类连发惩罚（diversity）
    const sameInRecent = recent.filter(c=>c===cat).length;
    score += -sameInRecent * 8;
    // 探索奖励：用户没刷过的品类
    const seenN = (seenCount[cat]||0);
    if(seenN===0) score += 4;
    else if(seenN<=2) score += 2;
    // 随机抖动
    score += (Math.random()-0.5) * 4;
    return score;
  };

  // 每次记录用户对当前卡的决定（决定影响后续推荐）
  const recordDecision = (poi, verb)=>{
    if(verb === 'like'){
      tasteCount[poi.category] = (tasteCount[poi.category]||0) + 2;
    } else if(verb === 'maybe'){
      tasteCount[poi.category] = (tasteCount[poi.category]||0) + 1;
    }
  };

  // 撤销时回滚
  const undoDecision = (poi, verb)=>{
    if(verb === 'like'){
      tasteCount[poi.category] = Math.max(0, (tasteCount[poi.category]||0) - 2);
    } else if(verb === 'maybe'){
      tasteCount[poi.category] = Math.max(0, (tasteCount[poi.category]||0) - 1);
    }
  };

  const pickFromPool = (pool, opts)=>{
    if(!pool.length) return null;
    // 用 score 排序后从前 5 名里加权随机抽（避免每次都最高分）
    const scored = pool.map(p=>({p, s:computeScore(p,opts)}));
    scored.sort((a,b)=>b.s-a.s);
    const topN = scored.slice(0, Math.min(5, scored.length));
    // 加权随机：分数越高概率越大
    const weights = topN.map((x,i)=>Math.max(0.2, x.s+10-i*2));
    const sum = weights.reduce((a,b)=>a+b,0);
    let r = Math.random()*sum;
    for(let i=0;i<topN.length;i++){
      r -= weights[i];
      if(r<=0) return topN[i].p;
    }
    return topN[0].p;
  };

  const next = ()=>{
    const remaining = allPois.filter(p=>!seen.has(p.id));
    if(!remaining.length) return null;

    // 全品类自然抽取（餐饮也走偏好策略，无固定节奏）
    let chosen = pickFromPool(remaining, {coldStart: total<8});
    if(!chosen) chosen = remaining[0];

    seen.add(chosen.id);
    seenCount[chosen.category] = (seenCount[chosen.category]||0)+1;
    recent.push(chosen.category);
    if(recent.length > 5) recent.shift();
    total++;
    return chosen;
  };

  const peekNext = ()=>{
    // 不消费、用于卡堆下一张展示——简单返回第一个未看过的
    const remaining = allPois.filter(p=>!seen.has(p.id));
    return remaining[0] || null;
  };

  const stats = ()=>({
    seen: seen.size,
    total: allPois.length,
    taste: {...tasteCount},
    seenByCat: {...seenCount},
  });

  return { next, peekNext, recordDecision, undoDecision, stats };
}

/* ---------- 顶部 Header ---------- */
function Header({step,total,onBack,right}){
  return (
    <header className="sticky top-0 z-20 bg-cream/90 backdrop-blur border-b border-line">
      <div className="max-w-xl mx-auto px-5 pt-safe pb-3 flex items-center justify-between gap-3">
        <div className="flex items-center gap-2 min-w-0">
          {onBack && (
            <button onClick={onBack} className="w-8 h-8 shrink-0 grid place-items-center rounded-full border border-line text-ink/80 hover:bg-paper">←</button>
          )}
          <div className="leading-tight min-w-0">
            <div className="font-serif text-lg font-bold tracking-tight">SwipeGo</div>
            <div className="font-mono text-[10px] text-muted -mt-0.5 truncate">BANGKOK · 小时级清单</div>
          </div>
        </div>
        {right ? right : (
          <div className="font-mono text-[11px] text-muted shrink-0">
            STEP <span className="text-ink font-bold">{step}</span> / {total}
          </div>
        )}
      </div>
    </header>
  );
}

/* ---------- STEP 0: 开场问卷（仅天数） ---------- */
function StepIntake({onDone}){
  const [days,setDays] = useState(null);

  const choose = (v)=>{
    setDays(v);
    // 点完直接进入下一步，默认 09:00 / standard 强度（清单页可后续调整）
    setTimeout(()=>onDone({days:v, wake:'09:00', pace:'standard'}), 220);
  };

  const options = [
    {v:2,label:'2 天',sub:'极限周末'},
    {v:3,label:'3 天',sub:'黄金节奏'},
    {v:4,label:'4 天',sub:'推荐'},
    {v:5,label:'5 天',sub:'深度'},
    {v:6,label:'6 天',sub:'慢游'},
    {v:7,label:'7 天+',sub:'定居感'},
  ];

  return (
    <div className="max-w-xl mx-auto px-5 pt-6 pb-10">
      <div className="mb-8">
        <div className="font-mono text-[11px] text-accent tracking-widest mb-2">// 01 INTAKE</div>
        <h2 className="font-serif text-3xl font-bold leading-tight">你打算待几天？</h2>
        <p className="text-sm text-muted mt-2">SwipeGo 会按天给你排出小时级清单</p>
      </div>

      <div className="grid grid-cols-2 gap-3">
        {options.map(o=>{
          const active = days===o.v;
          return (
            <button key={o.v} onClick={()=>choose(o.v)}
              className={`relative p-5 rounded-2xl border-2 text-left transition ${active?'bg-ink text-white border-ink scale-[0.98] shadow-md':'bg-cream border-ink/20 text-ink hover:border-ink/50 active:scale-[0.98]'}`}>
              <div className="font-serif font-bold text-2xl">{o.label}</div>
              <div className={`text-xs mt-1 ${active?'text-white/85':'text-muted'}`}>{o.sub}</div>
              {active && <span className="absolute top-3 right-3 text-base tick-in text-white">✓</span>}
            </button>
          );
        })}
      </div>

      <p className="font-mono text-[10px] text-muted text-center mt-8 tracking-wider">
        SWIPE TO PLAN · 左滑跳过 · 右滑想去 · 下滑待定
      </p>
    </div>
  );
}

/* ---------- STEP 1: 刷 POI 卡 ---------- */
function StepSwipe({pois,onDone}){
  // 推荐引擎：每个 mount 创建一次，跨 render 持有状态
  const recoRef = useRef(null);
  if(!recoRef.current) recoRef.current = createRecommender(pois);
  const reco = recoRef.current;

  // queue 始终保持 [current, next, ...]，初始抽 2 张
  const [queue,setQueue] = useState(()=>{
    const a = reco.next(); const b = reco.next();
    return [a,b].filter(Boolean);
  });
  const [decisions,setDecisions] = useState({});
  const [history,setHistory] = useState([]);  // [{poi, verb}] 用于撤销
  const [openDetail,setOpenDetail] = useState(null);
  const [openShortlist,setOpenShortlist] = useState(false);
  const [exiting,setExiting] = useState(null);
  const [imgIdx,setImgIdx] = useState(0);

  // 拖拽用 ref
  const cardRef = useRef(null);
  const labelLikeRef = useRef(null);
  const labelPassRef = useRef(null);
  const labelMaybeRef = useRef(null);
  const dragRef = useRef({x:0,y:0,active:false,startX:0,startY:0});

  const current = queue[0];
  const next = queue[1];

  // 预加载 queue 里下一张 / 下下张的封面，让滑卡几乎瞬间显示
  useEffect(()=>{
    queue.slice(1, 4).forEach(p=>{
      if(!p) return;
      const url = p.cover_url;
      if(!url) return;
      const im = new Image();
      im.decoding = 'async';
      im.src = url;
    });
  }, [queue]);

  // 应用 transform 到 DOM
  const applyTransform = (x,y,withTransition=false)=>{
    const el = cardRef.current;
    if(!el) return;
    const rot = Math.max(-22, Math.min(22, x*0.08));
    el.style.transition = withTransition ? 'transform .28s cubic-bezier(.2,.8,.2,1)' : 'none';
    el.style.transform = `translate3d(${x}px, ${y}px, 0) rotate(${rot}deg)`;
    if(labelLikeRef.current) labelLikeRef.current.style.opacity = Math.max(0, Math.min(1, (x-20)/100));
    if(labelPassRef.current) labelPassRef.current.style.opacity = Math.max(0, Math.min(1, (-x-20)/100));
    if(labelMaybeRef.current) labelMaybeRef.current.style.opacity = Math.max(0, Math.min(1, (y-20)/100));
  };

  const decide = (verb)=>{
    if(!current || exiting) return;
    const dir = verb==='like'?{x:700,y:-80}:verb==='pass'?{x:-700,y:-80}:{x:0,y:800};
    setExiting({dir,verb});
    const el = cardRef.current;
    if(el){
      const rot = verb==='like'?22:verb==='pass'?-22:0;
      el.style.transition = 'transform .26s cubic-bezier(.32,.72,.42,1), opacity .26s ease';
      el.style.transform = `translate3d(${dir.x}px, ${dir.y}px, 0) rotate(${rot}deg)`;
      el.style.opacity = '0';
    }
    const snapshotPoi = current;
    setTimeout(()=>{
      // 通知推荐引擎并抽下一张
      reco.recordDecision(snapshotPoi, verb);
      setDecisions(prev=>({...prev, [snapshotPoi.id]:verb}));
      setHistory(h=>[...h, {poi:snapshotPoi, verb}]);
      // queue 出列 + 补充
      setQueue(q=>{
        const newNext = reco.next();
        const arr = q.slice(1);
        if(newNext) arr.push(newNext);
        return arr;
      });
      setImgIdx(0);
      setExiting(null);
      requestAnimationFrame(()=>{
        const el2 = cardRef.current;
        if(el2){
          el2.style.transition = 'none';
          el2.style.transform = 'translate3d(0,0,0) rotate(0deg)';
          el2.style.opacity = '1';
        }
        if(labelLikeRef.current) labelLikeRef.current.style.opacity = 0;
        if(labelPassRef.current) labelPassRef.current.style.opacity = 0;
        if(labelMaybeRef.current) labelMaybeRef.current.style.opacity = 0;
        dragRef.current = {x:0,y:0,active:false,startX:0,startY:0};
      });
    },260);
  };

  const undo = ()=>{
    if(history.length === 0 || exiting) return;
    const last = history[history.length-1];
    setHistory(h=>h.slice(0,-1));
    setDecisions(prev=>{
      const n = {...prev};
      delete n[last.poi.id];
      return n;
    });
    // 撤销时把卡塞回 queue 头部，让用户再决定一次
    reco.undoDecision(last.poi, last.verb);
    setQueue(q=>[last.poi, ...q]);
    setImgIdx(0);
    setExiting(null);
    requestAnimationFrame(()=>{
      const el = cardRef.current;
      if(el){
        el.style.transition = 'none';
        el.style.transform = 'translate3d(0,0,0) rotate(0deg)';
        el.style.opacity = '1';
      }
    });
  };

  const updateDecision = (poiId, newVerb)=>{
    setDecisions(prev=>{
      if(!newVerb){ const n={...prev}; delete n[poiId]; return n; }
      return {...prev, [poiId]: newVerb};
    });
  };

  const onPointerDown = (e)=>{
    if(exiting) return;
    e.currentTarget.setPointerCapture(e.pointerId);
    dragRef.current = {x:0,y:0,active:true,startX:e.clientX,startY:e.clientY};
    if(cardRef.current) cardRef.current.style.transition = 'none';
  };
  const onPointerMove = (e)=>{
    const d = dragRef.current;
    if(!d.active) return;
    const dx = e.clientX - d.startX;
    const dy = e.clientY - d.startY;
    d.x = dx; d.y = dy;
    applyTransform(dx, dy);
  };
  const onPointerUp = (e)=>{
    const d = dragRef.current;
    if(!d.active) return;
    const {x,y} = d;
    const moved = Math.hypot(x,y);
    d.active = false;
    if(x > 110)      decide('like');
    else if(x < -110) decide('pass');
    else if(y > 110)  decide('maybe');
    else if(moved < 8){
      // 点击：按横向位置分 3 段（左/中/右）
      const el = cardRef.current;
      if(el && current){
        const rect = el.getBoundingClientRect();
        const ratio = (e.clientX - rect.left) / rect.width;
        const total = getPoiImages(current).length;
        if(total > 1 && ratio < 0.32){
          // 左侧：上一张
          setImgIdx(i => (i - 1 + total) % total);
          applyTransform(0, 0, true);
        } else if(total > 1 && ratio > 0.68){
          // 右侧：下一张
          setImgIdx(i => (i + 1) % total);
          applyTransform(0, 0, true);
        } else {
          // 中间：打开详情
          setOpenDetail(current);
          applyTransform(0, 0, true);
        }
      } else {
        applyTransform(0, 0, true);
      }
    }
    else {
      // 弹回
      applyTransform(0, 0, true);
      // 标签也淡出
      [labelLikeRef, labelPassRef, labelMaybeRef].forEach(r=>{
        if(r.current){
          r.current.style.transition = 'opacity .2s';
          r.current.style.opacity = 0;
        }
      });
    }
  };

  // 全部刷完不自动跳，让用户去清单里点"开始规划"
  // （撤销后也能继续操作）

  const doneCount = Object.keys(decisions).length;
  const likeCount = Object.values(decisions).filter(v=>v==='like').length;
  const maybeCount = Object.values(decisions).filter(v=>v==='maybe').length;
  const totalPois = pois.length;
  const allDone = !current; // queue 空 = 没卡可刷了

  // 触发规划
  const startPlanning = ()=>{
    const liked = pois.filter(p=>decisions[p.id]==='like');
    const maybe = pois.filter(p=>decisions[p.id]==='maybe');
    if(liked.length + maybe.length === 0) return;
    onDone({liked,maybe,decisions});
  };

  if(!current && !allDone){
    return <div className="p-10 text-center text-muted">整理中...</div>;
  }

  return (
    <div className="max-w-xl mx-auto px-5 pt-4 pb-6">
      {/* 进度 */}
      <div className="mb-3 flex items-center justify-between text-[11px] font-mono text-muted">
        <span>{doneCount} / {totalPois}</span>
        <span className="text-accent">♥ 想去 {likeCount}</span>
      </div>
      <div className="h-1 bg-paper rounded-full overflow-hidden mb-5">
        <div className="h-full bg-ink transition-all" style={{width:`${(doneCount/totalPois)*100}%`}}/>
      </div>

      {/* 卡堆 / 完成态 */}
      <div className="relative select-none" style={{height:'min(640px, calc(100vh - 220px))'}}>
        {!allDone && (
          <>
            {next && <PoiCard poi={next} stacked/>}
            <div
              ref={cardRef}
              className="absolute inset-0"
              style={{touchAction:'none', willChange:'transform', transform:'translate3d(0,0,0)'}}
              onPointerDown={onPointerDown}
              onPointerMove={onPointerMove}

function getPoiImages(poi){
  // gallery 优先，其次 cover_url；去重
  const list = [];
  (poi.gallery||[]).forEach(u=>{ if(u && !list.includes(u)) list.push(u); });
  if(poi.cover_url && !list.includes(poi.cover_url)) list.unshift(poi.cover_url);
  return list;
}

function PoiCover({poi, h='h-64', imgIdx=0, showIndicator=false}){
  const [failed,setFailed] = useState({});
  const [loaded,setLoaded] = useState({}); // url -> true 表示已经触发过 onLoad
  const meta = CAT_META[poi.category] || {label:poi.category,icon:'📍'};
  const images = getPoiImages(poi);
  const total = images.length;
  const safeIdx = total ? ((imgIdx % total) + total) % total : 0;
  const url = images[safeIdx];
  const showImage = url && !failed[url];
  const isLoading = url && !loaded[url] && !failed[url];

  // 预加载相邻图（下一张优先）
  useEffect(()=>{
    if(total<=1) return;
    const nexts = [
      images[(safeIdx+1)%total],
      images[(safeIdx-1+total)%total],
    ];
    nexts.forEach(u=>{
      if(!u || loaded[u] || failed[u]) return;
      const im = new Image();
      im.onload = ()=> setLoaded(s=> s[u] ? s : ({...s,[u]:true}));
      im.onerror = ()=> setFailed(s=> s[u] ? s : ({...s,[u]:true}));
      im.src = u;
    });
  },[safeIdx,total,url]);

  return (
    <div className={`relative ${h} overflow-hidden`} style={{background:poi.color||'#0F3D2E'}}>
      {showImage && (
        <img src={url} alt={poi.name_zh}
          key={url}
          className="absolute inset-0 w-full h-full object-cover"
          style={{opacity: loaded[url] ? 1 : 0, transition:'opacity .18s ease'}}
          loading="eager"
          decoding="async"
          onLoad={()=>setLoaded(s=>({...s,[url]:true}))}
          onError={()=>setFailed(f=>({...f, [url]:true}))}/>
      )}
      {!showImage && (
        <>
          <div className="absolute inset-0 opacity-15"
            style={{backgroundImage:'linear-gradient(rgba(255,255,255,.6) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.6) 1px,transparent 1px)',backgroundSize:'28px 28px'}}/>
          <div className="absolute -right-4 -bottom-6 text-[180px] leading-none opacity-25 select-none">{poi.icon||meta.icon}</div>
        </>
      )}
      {/* loading 兜底：图未加载完时盖一层暗色 + spinner，避免视觉残留为上一张 */}
      {isLoading && (
        <div className="absolute inset-0 flex items-center justify-center pointer-events-none z-[5]"
          style={{background:'rgba(0,0,0,0.35)', backdropFilter:'blur(2px)'}}>
          <div className="w-7 h-7 rounded-full border-2 border-white/30 border-t-white animate-spin"/>
        </div>
      )}

      {/* 顶部分段 indicator（Story 风格） */}
      {showIndicator && total > 1 && (
        <div className="absolute top-2 left-2 right-2 flex gap-1 pointer-events-none z-10">
          {images.map((_,i)=>(
            <div key={i} className="flex-1 h-[3px] rounded-full bg-white/30 overflow-hidden">
              <div className="h-full bg-white transition-all" style={{width: i===safeIdx?'100%':(i<safeIdx?'100%':'0%'), opacity: i===safeIdx?1:(i<safeIdx?0.55:0)}}/>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function PoiDetail({poi,onClose}){
  const sheetRef = useRef(null);
  const bgRef = useRef(null);
  const scrollerRef = useRef(null);
  const dragRef = useRef({active:false,startY:0,y:0});
  const [imgIdx,setImgIdx] = useState(0);
  const images = getPoiImages(poi);
  const total = images.length;

  const goPrev = (e)=>{
    e.stopPropagation();
    if(total<=1) return;
    setImgIdx(i=>(i-1+total)%total);
  };
  const goNext = (e)=>{
    e.stopPropagation();
    if(total<=1) return;
    setImgIdx(i=>(i+1)%total);
  };

  const apply = (y, withTransition=false)=>{
    const el = sheetRef.current;
    if(!el) return;
    el.style.transition = withTransition ? 'transform .26s cubic-bezier(.32,.72,.42,1)' : 'none';
    el.style.transform = `translate3d(0, ${Math.max(0,y)}px, 0)`;
    if(bgRef.current){
      const op = Math.max(0, 1 - y/500);
      bgRef.current.style.background = `rgba(0,0,0,${(0.4*op).toFixed(3)})`;
    }
  };

  const close = ()=>{
    apply(window.innerHeight, true);
    setTimeout(onClose, 220);
  };

  const onPointerDown = (e)=>{
    // 只在按到"手柄 / 顶部图"上才启用拖拽
    // 或按在内容区但内容已经滚到顶部
    const onHandle = e.target.closest && e.target.closest('[data-detail-handle]');
    const sc = scrollerRef.current;
    if(!onHandle && sc && sc.scrollTop > 0) return;
    dragRef.current = {active:true, startY:e.clientY, y:0};
  };
  const onPointerMove = (e)=>{
    const d = dragRef.current;
    if(!d.active) return;
    const dy = e.clientY - d.startY;
    if(dy < 0){ d.y = 0; apply(0); return; }
    d.y = dy;
    apply(dy);
  };
  const onPointerUp = ()=>{
    const d = dragRef.current;
    if(!d.active) return;
    d.active = false;
    if(d.y > 120) close();
    else apply(0, true);
  };

  return (
    <div ref={bgRef}
      className="fixed inset-0 z-50 sheet-fade"
      style={{background:'rgba(0,0,0,.4)'}}
      onClick={close}>
      <div ref={sheetRef}
        className="absolute inset-x-0 bottom-0 bg-cream rounded-t-3xl max-h-[92vh] overflow-hidden sheet-up flex flex-col"
        style={{touchAction:'none', willChange:'transform'}}
        onClick={(e)=>e.stopPropagation()}
        onPointerDown={onPointerDown}
        onPointerMove={onPointerMove}
        onPointerUp={onPointerUp}
        onPointerCancel={onPointerUp}>

        {/* 拖拽 handle */}
        <div data-detail-handle className="shrink-0 pt-3 pb-2">
          <div className="w-12 h-1.5 bg-line rounded-full mx-auto"/>
        </div>

        {/* 顶部大图也作拖拽区 + 支持左右点切图 */}
        <div data-detail-handle className="relative h-56 shrink-0">
          <PoiCover poi={poi} h="h-full" imgIdx={imgIdx} showIndicator={total>1}/>
          {/* 左右半屏触控区，仅多图时显示 */}
          {total>1 && (
            <>
              <button onClick={goPrev}
                className="absolute left-0 top-0 bottom-0 w-[35%] z-20 flex items-center justify-start pl-3"
                style={{background:'transparent', WebkitTapHighlightColor:'transparent'}}>
                <span className="w-9 h-9 rounded-full bg-black/35 backdrop-blur text-white grid place-items-center text-base opacity-0 hover:opacity-100">‹</span>
              </button>
              <button onClick={goNext}
                className="absolute right-0 top-0 bottom-0 w-[35%] z-20 flex items-center justify-end pr-3"
                style={{background:'transparent', WebkitTapHighlightColor:'transparent'}}>
                <span className="w-9 h-9 rounded-full bg-black/35 backdrop-blur text-white grid place-items-center text-base opacity-0 hover:opacity-100">›</span>
              </button>
            </>
          )}
          <div className="absolute inset-0 pointer-events-none"
            style={{background:'linear-gradient(180deg, rgba(0,0,0,0) 40%, rgba(0,0,0,.7) 100%)'}}/>
          <div className="absolute inset-0 flex items-end p-5 pointer-events-none">
            <div className="text-white">
              <div className="font-mono text-[10px] opacity-85 tracking-widest">{CAT_META[poi.category]?.label}</div>
              <div className="font-serif text-2xl font-bold mt-0.5" style={{textShadow:'0 2px 8px rgba(0,0,0,.5)'}}>{poi.name_zh}</div>
              {total>1 && <div className="font-mono text-[10px] opacity-70 mt-1">{imgIdx+1}/{total}</div>}
            </div>
          </div>
          <button onClick={close}
            className="absolute top-3 right-3 w-9 h-9 rounded-full bg-black/45 backdrop-blur text-white grid place-items-center text-base active:scale-95 z-30">✕</button>
        </div>

        {/* 内容可滚动区 */}
        <div ref={scrollerRef}
          className="flex-1 overflow-y-auto no-scrollbar"
          style={{overscrollBehavior:'contain', touchAction:'pan-y'}}>
          <div className="p-5 pb-10">
            <p className="text-xs text-muted font-mono">{poi.name_en}{poi.name_th ? ` · ${poi.name_th}` : ''}</p>

            <h4 className="font-serif font-bold mt-6 mb-2">简介</h4>
            <p className="text-sm leading-relaxed text-ink/85 whitespace-pre-line">{poi.long_desc || poi.short_desc}</p>

            </>}

            {poi.tips?.length>0 && <>
              <h4 className="font-serif font-bold mt-6 mb-2">贴士</h4>
              <ul className="space-y-1.5">

                  <li key={i} className="text-sm text-ink/85 pl-5 relative before:content-['·'] before:absolute before:left-1 before:text-accent before:font-bold">{t}</li>

            <div className="flex flex-wrap gap-1.5 mt-6">

              ))}

  );
}

/* ---------- STEP 2: 行程清单 ---------- */
function StepItinerary({intake,liked,maybe,onRestart}){
  const [loading,setLoading] = useState(true);
  const [err,setErr] = useState(null);
  const [result,setResult] = useState(null); // {days:[], overallTip:""}
  const [tab,setTab] = useState(0);
  const [done,setDone] = useState({});

  const runAI = async ()=>{
    setLoading(true); setErr(null);
    try {
      const r = await aiBuildItinerary(liked, maybe, intake);
      setResult(r);
      setTab(0);
      setDone({});
    } catch(e){
      console.error(e);
      setErr(e.message || String(e));
    } finally {
      setLoading(false);
    }
  };

  useEffect(()=>{ runAI(); }, []); // 进入页面立刻调

  if(loading) return <ItineraryLoading liked={liked} days={intake.days}/>;
  if(err) return <ItineraryError err={err} onRetry={runAI} onBack={onRestart}/>;
  if(!result) return null;

  const itinerary = result.days;
  const totalItems = itinerary.reduce((s,d)=>s+d.items.length,0);
  const doneCount = Object.keys(done).filter(k=>done[k]).length;
  const day = itinerary[tab];

  return (
    <div className="max-w-xl mx-auto px-5 pt-4 pb-24">
      <div className="mb-5">
        <div className="font-mono text-[11px] text-accent tracking-widest mb-1">// 03 ITINERARY · AI</div>
        <div className="flex items-end justify-between">
          <h2 className="font-serif text-2xl font-bold">你的曼谷行程</h2>
          <button onClick={runAI} className="font-mono text-[11px] text-ink underline underline-offset-2">↻ AI 重排</button>
        </div>
        <p className="text-xs text-muted mt-1">{intake.days} 天 · {liked.length} 个想去{maybe.length>0?` · ${maybe.length} 待定`:''} · ✨ DeepSeek 生成</p>
      </div>

      {/* AI 整体建议 */}
      {result.overallTip && (
        <div className="bg-paper border border-accent/30 rounded-2xl p-4 mb-5">
          <div className="flex items-start gap-2">
            <span className="text-base shrink-0">✨</span>
            <div className="flex-1">
              <div className="font-mono text-[10px] text-accent tracking-widest mb-1">AI 旅行贴士</div>
              <p className="text-[13px] text-ink/85 leading-relaxed">{result.overallTip}</p>
            </div>
          </div>
        </div>
      )}

      {/* 总进度 */}
      <div className="bg-paper border border-line rounded-2xl p-4 mb-5">
        <div className="flex items-center justify-between mb-2">
          <span className="font-serif font-bold text-sm">总进度</span>
          <span className="font-mono text-sm"><span className="text-ink font-bold">{doneCount}</span><span className="text-muted"> / {totalItems}</span></span>
        </div>
        <div className="h-2 bg-cream rounded-full overflow-hidden">
          <div className="h-full bg-accent transition-all" style={{width:`${totalItems?(doneCount/totalItems)*100:0}%`}}/>
        </div>
      </div>

      {/* Day Tabs */}
      <div className="flex gap-2 overflow-x-auto no-scrollbar mb-5 pb-1">
        {itinerary.map((d,i)=>{
          const active = i===tab;
          const dCount = d.items.filter(it=>done[it.poi.id]).length;
          return (
            <button key={i} onClick={()=>setTab(i)}
              className={`shrink-0 px-4 py-2.5 rounded-xl border-2 transition text-left min-w-[88px] ${active?'bg-ink text-white border-ink shadow-md':'bg-cream border-line text-ink'}`}>
              <div className="font-mono text-[10px] opacity-70">DAY {i+1}</div>
              <div className="font-serif font-bold text-sm leading-tight mt-0.5 line-clamp-1">{d.theme}</div>
              <div className="font-mono text-[10px] mt-1 opacity-70">{dCount}/{d.items.length}</div>
            </button>
          );
        })}
      </div>

      {/* 当日 theme（醒目卡） */}
      {day && (
        <div className="bg-ink text-white rounded-2xl p-4 mb-4">
          <div className="font-mono text-[10px] opacity-70 tracking-widest">DAY {tab+1} · {day.items.length} 项</div>
          <div className="font-serif text-xl font-bold mt-1">{day.theme}</div>
        </div>
      )}

      {/* 当天的时间轴 */}
      <div className="relative">
        <div className="absolute left-4 top-4 bottom-4 w-px bg-line"/>
        <div className="space-y-3">
          {day && day.items.map((it,i)=>(
            <TimelineItem key={i} item={it} checked={!!done[it.poi.id]}
              onToggle={()=>setDone(prev=>({...prev,[it.poi.id]:!prev[it.poi.id]}))}/>
          ))}
          {day && day.items.length===0 && (
            <div className="py-10 text-center text-muted text-sm">这一天 AI 给你留白了 🧘</div>
          )}
        </div>
      </div>

      {maybe.length>0 && (
        <div className="mt-8 p-4 bg-paper border border-dashed border-line rounded-2xl">
          <div className="flex items-center justify-between mb-2">
            <span className="font-serif font-bold text-sm">待定清单</span>
            <span className="font-mono text-[11px] text-muted">{maybe.length} 项</span>
          </div>
          <div className="flex flex-wrap gap-1.5">
            {maybe.map(p=>(
              <span key={p.id} className="px-2.5 py-1 bg-cream rounded-full text-[11px] border border-line">{p.name_zh}</span>
            ))}
          </div>
        </div>
      )}

      <button onClick={onRestart} className="mt-8 w-full py-3 rounded-xl border border-line text-sm text-muted">重新开始</button>

      <p className="font-mono text-[10px] text-muted text-center mt-6 tracking-wider">MADE WITH SWIPEGO · ✨ AI by DeepSeek</p>
    </div>
  );
}

/* ---------- AI 加载态 ---------- */
function ItineraryLoading({liked, days}){
  const [step,setStep] = useState(0);
  const phases = [
    `分析你选的 ${liked.length} 个景点`,
    "按地理位置聚类...",
    "匹配每个景点的最佳时段...",
    `排出 ${days} 天小时级清单...`,
    "撰写每日主题与贴士...",
  ];
  useEffect(()=>{
    const t = setInterval(()=>setStep(s=>(s+1)%phases.length), 1400);
    return ()=>clearInterval(t);
  },[]);
  return (
    <div className="max-w-xl mx-auto px-5 pt-12 pb-20 text-center">
      <div className="text-6xl mb-5 select-none animate-pulse">✨</div>
      <div className="font-mono text-[11px] text-accent tracking-widest mb-2">AI GENERATING</div>
      <h2 className="font-serif text-2xl font-bold">DeepSeek 正在为你排程</h2>
      <p className="text-sm text-muted mt-3">通常需要 5-15 秒</p>
      <div className="mt-10 space-y-2">
        {phases.map((p,i)=>(
          <div key={i} className={`flex items-center gap-3 transition ${i<=step?'opacity-100':'opacity-30'}`}>
            <div className={`w-2 h-2 rounded-full ${i<step?'bg-accent':i===step?'bg-ink animate-pulse':'bg-line'}`}/>
            <span className={`text-[13px] font-mono ${i===step?'text-ink font-bold':'text-muted'}`}>{p}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ---------- AI 失败态 ---------- */

  return (
    <div className="max-w-xl mx-auto px-5 pt-16 pb-10 text-center">
      <div className="text-5xl mb-4">😢</div>
      <h2 className="font-serif text-2xl font-bold">AI 暂时罢工了</h2>
      <p className="text-sm text-muted mt-2">网络或服务问题，再试一次通常就好</p>
      <div className="mt-4 p-3 bg-paper border border-line rounded-xl text-[11px] font-mono text-ink/70 text-left break-all">
        {err}
      </div>
      <div className="flex gap-3 mt-8">
        <button onClick={onBack} className="flex-1 py-3 rounded-xl border border-line text-sm text-ink">回去重选</button>
        <button onClick={onRetry} className="flex-1 py-3 rounded-xl bg-ink text-white border-2 border-ink font-bold text-sm shadow-md">重试 AI ↻</button>
      </div>
    </div>
  );
}

/* ---------- AI 行程生成（DeepSeek） ---------- */
// ⚠️ 临时 demo 方案：key 写在前端（公开仓库会被扒）
// 缓解：DeepSeek 后台给这个 key 设了 ¥10 上限，被刷也只损失这点
// TODO 上线前：部署 cf-worker/ 把 key 藏到代理，详见 cf-worker/README.md
const PROXY_URL = ""; // ← 部署完代理后填这里（如 https://swipego-deepseek-proxy.xxx.workers.dev/v1/chat/completions）
const DIRECT_API = "https://api.deepseek.com/chat/completions";
const DIRECT_KEY = "sk-20f35588deac4e1ca10ab9e28a714d23"; // ← demo key，限额 ¥10
const API_URL = PROXY_URL || DIRECT_API;

async function aiBuildItinerary(liked, maybe, intake){
  // 配置自检
  if(!PROXY_URL && !DIRECT_KEY){
    throw new Error('AI 服务未配置。请部署 CF Worker 代理后填入 PROXY_URL（见 cf-worker/README.md）');
  }
  // 收缩 POI 信息只保留 AI 排程必需字段，省 tokens
  const slim = (p)=>({
    id: p.id,
    name: p.name_zh,
    category: p.category_label || p.category,
    district: p.district_zh || p.district,
    duration_hr: p.duration_hr,
    best_time: p.best_time,
    price_thb: p.price_thb,
    lat: p.lat, lng: p.lng,
    tips: (p.tips||[]).slice(0,2),
  });
  const likedSlim = liked.map(slim);
  const maybeSlim = maybe.map(slim);

  const sys = "你是资深曼谷旅行规划师，擅长为 J 人型用户生成小时级精确行程。";
  const user = `用户想用 ${intake.days} 天玩曼谷，每天 09:00 起床，标准强度（每天 5-6 项）。

他**右滑想去**了 ${likedSlim.length} 个 POI：
${JSON.stringify(likedSlim, null, 2)}

${maybeSlim.length>0 ? `他还**下滑待定**了 ${maybeSlim.length} 个，如果想去的不够填满天数可以补充使用：
${JSON.stringify(maybeSlim, null, 2)}` : ''}

要求：
1. 按地理位置就近聚类（用 lat/lng），同一天尽量同区域
2. 尊重每个 POI 的 best_time（早上的去早上、傍晚的去傍晚）
3. 每个时段 24h 制起止时刻（如 "09:30"）
4. 中间留 60-90 分钟用餐（12:00-13:30 / 18:30-20:00 高峰）、20-30 分钟通勤
5. 每天起一个有"项目管理感、J 人爽点"的 day_theme（短促有力，<= 12 字，可加 emoji）
6. 每个安排写一句 AI 贴士 note（why this time / what to watch out for / 通勤建议）
7. 如果想去的 POI 不够填满 ${intake.days} 天，可以从待定清单里挑 1-2 个补充；仍然不够就让那一天为"留白日"，items 为空数组
8. POI 不要重复出现

**严格输出 JSON**（不要 markdown 代码块）：
{
  "days": [
    {
      "day": 1,
      "theme": "老城寺庙暴走 ☀️",
      "items": [
        {"poi_id":"bkk-001","start":"08:30","end":"11:00","note":"开门即到，避开团客高峰"}
      ]
    }
  ],
  "overall_tip": "整体建议（雨季穿搭/打车/支付等）"
}`;

  const headers = {'Content-Type': 'application/json'};
  // 走代理时不需要 Authorization；只在直连模式下加
  if(!PROXY_URL && DIRECT_KEY) headers['Authorization'] = `Bearer ${DIRECT_KEY}`;
  const res = await fetch(API_URL, {
    method: 'POST',
    headers,
    body: JSON.stringify({
      model: 'deepseek-chat',
      messages: [
        {role:'system', content: sys},
        {role:'user', content: user},
      ],
      temperature: 0.6,
      response_format: {type:'json_object'},
    }),
  });
  if(!res.ok){
    const t = await res.text();
    throw new Error(`DeepSeek ${res.status}: ${t.slice(0,200)}`);
  }
  const data = await res.json();
  const content = data?.choices?.[0]?.message?.content;
  if(!content) throw new Error('AI 没有返回内容');

  let parsed;
  try { parsed = JSON.parse(content); }
  catch(e){ throw new Error('AI 返回的不是 JSON: ' + content.slice(0,150)); }

  // 把 poi_id 还原成完整 POI 对象，方便渲染
  const poiMap = {};
  [...liked, ...maybe].forEach(p=>poiMap[p.id]=p);
  const days = (parsed.days||[]).map((d,i)=>({
    dayIdx: i,
    theme: d.theme || `Day ${i+1}`,
    items: (d.items||[]).map(it=>({
      poi: poiMap[it.poi_id],
      start: it.start,
      end: it.end,
      note: it.note || '',
    })).filter(it=>it.poi),
  }));
  return { days, overallTip: parsed.overall_tip || '' };
}


/* ---------- 空态：等数据 ---------- */
function DataPending({err}){
  return (
    <div className="max-w-xl mx-auto px-5 py-20 text-center">
      <div className="font-mono text-[11px] text-accent tracking-widest mb-2">// LOADING</div>
      <h2 className="font-serif text-2xl font-bold">数据整理中</h2>
      <p className="text-sm text-muted mt-3 leading-relaxed">
        研究 Agent 正在爬取并整理 50 个曼谷 POI 数据……<br/>
        完成后会写入 <span className="font-mono text-ink">data/bangkok-pois.json</span>，刷新页面即可看到。
      </p>
      {err && <div className="mt-6 p-4 bg-paper border border-line rounded-xl text-xs text-muted font-mono text-left">{err}</div>}
      <button onClick={()=>location.reload()} className="mt-8 px-6 py-3 btn-primary rounded-xl text-sm font-serif font-bold">刷新重试</button>
    </div>
  );
}

/* ---------- 主 App ---------- */
function App(){
  const {data,err} = usePois();
  const [step,setStep] = useState(0);
  const [intake,setIntake] = useState(null);
  const [swipeResult,setSwipeResult] = useState(null);

  const reset = ()=>{setStep(0); setIntake(null); setSwipeResult(null);};

  if(!data) return <><Header step={0} total={3}/><DataPending err={err}/></>;

  return (
    <div className="min-h-screen">
      <Header
        step={step+1}
        total={3}
        onBack={step>0?()=>setStep(s=>Math.max(0,s-1)):null}
        right={step===1 ? <span/> : null}/>

      {step===0 && (
        <StepIntake onDone={(v)=>{setIntake(v); setStep(1);}}/>
      )}
      {step===1 && intake && (
        <StepSwipe pois={data.pois} onDone={(r)=>{setSwipeResult(r); setStep(2);}}/>
      )}
      {step===2 && swipeResult && (
        <StepItinerary intake={intake} liked={swipeResult.liked} maybe={swipeResult.maybe} onRestart={reset}/>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
