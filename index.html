/* ---------- 餐厅选择抽屉（MealPicker） ---------- */
// 两个 tab：①附近 POI（从 bangkok-pois.json 里 category=美食 + 距离过滤）
//          ②手动添加（用户填名字 + 可选地址）
// v3 加 ③Google Places 搜索
function MealPicker({block, allPois, onClose, onChoose, onClear}){
  const [tab,setTab] = useState('nearby');
  const [manualName,setManualName] = useState('');
  const [manualAddr,setManualAddr] = useState('');
  const [radiusKm,setRadiusKm] = useState(1.5);

  const haversineKm = (a, b)=>{
    if(!a || !b || a.lat==null || a.lng==null || b.lat==null || b.lng==null) return Infinity;
    const R = 6371;
    const dLat = (b.lat - a.lat) * Math.PI / 180;
    const dLng = (b.lng - a.lng) * Math.PI / 180;
    const lat1 = a.lat * Math.PI / 180;
    const lat2 = b.lat * Math.PI / 180;
    const x = Math.sin(dLat/2)**2 + Math.sin(dLng/2)**2 * Math.cos(lat1) * Math.cos(lat2);
    return 2 * R * Math.asin(Math.sqrt(x));
  };

  const isFood = (p)=>{
    const cat = (p.category||'').toLowerCase();
    const label = p.category_label || '';
    return cat==='food' || cat==='restaurant' || /美食|餐厅|餐|小吃|夜市/.test(label);
  };

  const center = (block.near_lat!=null && block.near_lng!=null) ? {lat:block.near_lat, lng:block.near_lng} : null;

  const candidates = (allPois||[])
    .filter(isFood)
    .map(p => ({poi:p, dist: center ? haversineKm(center, p) : 0}))
    .filter(x => !center || x.dist <= radiusKm)
    .sort((a,b)=>a.dist-b.dist)
    .slice(0, 30);

  const submitManual = ()=>{
    if(!manualName.trim()){ alert('餐厅名字不能空'); return; }
    onChoose({
      id: 'manual-' + Date.now(),
      name_zh: manualName.trim(),
      district_zh: manualAddr.trim() || block.near_district || '',
      district: manualAddr.trim() || block.near_district || '',
      category: 'food',
      category_label: '美食（手动）',
      _manual: true,
    });
  };

  const meta = MEAL_META[block.meal_type] || MEAL_META.lunch;

  return (
    <div className="fixed inset-0 z-50 bg-black/40 backdrop-blur-sm sheet-fade" onClick={onClose}>
      <div className="absolute inset-x-0 bottom-0 bg-cream rounded-t-3xl max-h-[85vh] overflow-hidden sheet-up flex flex-col"
        onClick={(e)=>e.stopPropagation()}>
        <div className="w-10 h-1 bg-line rounded-full mx-auto mt-3 shrink-0"/>

        {/* 标题 */}
        <div className="px-5 pt-3 pb-3 shrink-0">
          <div className="flex items-baseline justify-between">
            <h3 className="font-serif text-xl font-bold">{meta.icon} 选 {meta.label} 餐厅</h3>
            <button onClick={onClose} className="font-mono text-xs text-muted">收起 ↓</button>
          </div>
          <p className="text-xs text-muted mt-1">
            {block.start} - {block.end}
            {block.near_district ? ` · 📍 ${block.near_district}` : ''}
            {center ? ` · 半径 ${radiusKm}km` : ''}
          </p>
          {block.ai_hint && (
            <div className="mt-2 px-3 py-2 bg-paper border border-accent/20 rounded-lg">
              <p className="text-[11px] text-ink/80">💡 {block.ai_hint}</p>
            </div>
          )}
        </div>

        {/* Tabs */}
        <div className="flex gap-2 px-5 mb-3 shrink-0">
          <button onClick={()=>setTab('nearby')}
            className={`flex-1 py-2.5 rounded-xl border-2 transition ${tab==='nearby'?'bg-accent text-white border-accent shadow-md':'bg-cream border-line text-ink'}`}>
            <div className="font-serif font-bold text-sm">📍 附近 <span className="font-mono ml-1">{candidates.length}</span></div>
          </button>
          <button onClick={()=>setTab('manual')}
            className={`flex-1 py-2.5 rounded-xl border-2 transition ${tab==='manual'?'bg-ink text-white border-ink shadow-md':'bg-cream border-line text-ink'}`}>
            <div className="font-serif font-bold text-sm">✏️ 手动添加</div>
          </button>
        </div>

        {/* 内容 */}
        <div className="flex-1 overflow-y-auto px-5 pb-5">
          {tab==='nearby' && (
            <div className="space-y-2">
              {candidates.length === 0 && (
                <div className="py-8 text-center text-muted text-sm">
                  附近没找到美食 POI 😅<br/>
                  <button onClick={()=>setRadiusKm(r=>r+1)} className="mt-3 px-3 py-1.5 rounded-md font-mono text-xs bg-paper border border-line">
                    扩大到 {radiusKm+1}km
                  </button>
                </div>
              )}
              {candidates.map(({poi,dist})=>(
                <button key={poi.id} onClick={()=>onChoose(poi)}
                  className="w-full text-left bg-paper border border-line rounded-xl p-3 hover:border-accent transition flex gap-3 items-start">
                  <div className="w-12 h-12 rounded-lg shrink-0 overflow-hidden" style={{background:poi.color||'#0F3D2E'}}>
                    {poi.cover_url
                      ? <img src={poi.cover_url} className="w-full h-full object-cover" loading="lazy"
                          onError={(e)=>{e.currentTarget.style.display='none'}}/>
                      : <div className="w-full h-full grid place-items-center text-xl text-white/95">{poi.icon||'🍜'}</div>}
                  </div>
                  <div className="flex-1 min-w-0">
                    <div className="font-serif font-bold text-sm truncate">{poi.name_zh}</div>
                    <div className="text-[11px] text-muted truncate">{poi.district_zh||poi.district}</div>
                    <div className="font-mono text-[10px] text-muted mt-0.5">
                      {dist!=null && isFinite(dist) ? `📏 ${dist.toFixed(1)}km` : ''}
                      {poi.price_thb ? ` · 💰 ${poi.price_thb} 铢` : ''}
                    </div>
                  </div>
                  <span className="text-accent font-mono text-xs shrink-0">选 →</span>
                </button>
              ))}
            </div>
          )}

          {tab==='manual' && (
            <div className="space-y-3">
              <div>
                <label className="block font-mono text-[11px] text-muted mb-1">餐厅名字 *</label>
                <input value={manualName} onChange={(e)=>setManualName(e.target.value)}
                  placeholder="例：Krua Apsorn / 网红船面店"
                  className="w-full px-3 py-2.5 rounded-xl border border-line bg-paper text-sm focus:outline-none focus:border-accent"/>
              </div>
              <div>
                <label className="block font-mono text-[11px] text-muted mb-1">地址/区域（可选）</label>
                <input value={manualAddr} onChange={(e)=>setManualAddr(e.target.value)}
                  placeholder={block.near_district || "例：老城区 / Tha Tien 码头"}
                  className="w-full px-3 py-2.5 rounded-xl border border-line bg-paper text-sm focus:outline-none focus:border-accent"/>
              </div>
              <button onClick={submitManual}
                className="w-full py-3 rounded-xl bg-ink text-white font-serif font-bold text-sm hover:opacity-90">
                ✓ 确认添加
              </button>
              <p className="text-[11px] text-muted text-center">
                v3 会接 Google 地图实时搜索，目前先手动填
              </p>
            </div>
          )}
        </div>

        {/* 底部：清除已选 */}
        {block.user_chosen_poi && (
          <div className="px-5 py-3 border-t border-line shrink-0 bg-paper">
            <button onClick={onClear}
              className="w-full py-2.5 rounded-xl border border-line text-sm text-muted hover:bg-cream">
              清除已选（"{block.user_chosen_poi.name_zh}"）
            </button>
          </div>
        )}
      </div>
    </div>
  );
}

**严格输出 JSON**（不要 markdown 代码块）：

    }

}`;

  const headers = {'Content-Type': 'application/json'};
  // 走代理时不需要 Authorization；只在直连模式下加

  const poiMap = {};

  const _dbg = {
    liked_ids: liked.map(p=>p.id),
    maybe_ids: maybe.map(p=>p.id),
    ai_returned_poi_ids: [],
    ai_returned_meal_after_ids: [],
    dropped_poi_ids: [],     // AI 返了但我们这边找不到 → 真正"被吃掉"
    invalid_time_items: [],
    invalid_time_meals: [],
  };

  const parseHHMM = (s) => {
    if(!s || typeof s !== 'string') return -1;
    const m = /^(\d{1,2}):(\d{2})$/.exec(s.trim());
    return m ? parseInt(m[1],10)*60 + parseInt(m[2],10) : -1;
  };
  const validTime = (s) => parseHHMM(s) >= 0;

  const days = (parsed.days||[]).map((d,i)=>{
    const blocks = [];

    // POI items
    for(const it of (d.items||[])){
      _dbg.ai_returned_poi_ids.push(it.poi_id);
      const poi = poiMap[it.poi_id];
      if(!poi) {
        console.warn('[itinerary] 找不到 poi_id', it.poi_id);
        _dbg.dropped_poi_ids.push(it.poi_id);
        continue;
      }
      if(!validTime(it.start) || !validTime(it.end)) {
        console.warn('[itinerary] 时刻非法', it);
        _dbg.invalid_time_items.push(it);
        continue;
      }
      blocks.push({
        type: 'poi',
        poi,
        start: it.start,
        end: it.end,
        note: it.note || '',
      });
    }

    // Meal slots
    for(const m of (d.meal_slots||[])){
      _dbg.ai_returned_meal_after_ids.push(m.after_poi_id);
      if(!validTime(m.start) || !validTime(m.end)) {
        console.warn('[itinerary] meal 时刻非法', m);
        _dbg.invalid_time_meals.push(m);
        continue;
      }
      const afterPoi = poiMap[m.after_poi_id];
      blocks.push({
        type: 'meal_placeholder',
        meal_type: m.type || 'lunch',
        start: m.start,
        end: m.end,
        near_district: m.near_district || (afterPoi?.district_zh || afterPoi?.district || ''),
        near_lat: afterPoi?.lat ?? null,
        near_lng: afterPoi?.lng ?? null,
        ai_hint: m.ai_hint || '',
        after_poi_id: m.after_poi_id || null,
        user_chosen_poi: null,
      });
    }

    blocks.sort((a,b)=>parseHHMM(a.start)-parseHHMM(b.start));

    return {
      dayIdx: i,
      theme: d.theme || `Day ${i+1}`,
      timeline: blocks,
    };
  });

  // 落库 debug
  const liked_set = new Set(_dbg.liked_ids);
  const used_set = new Set(_dbg.ai_returned_poi_ids);
  const liked_not_used = _dbg.liked_ids.filter(id => !used_set.has(id));   // 用户挑了 AI 没排
  const total_poi_in_plan = days.reduce((s,d)=>s + d.timeline.filter(b=>b.type==='poi').length, 0);
  const total_meal_in_plan = days.reduce((s,d)=>s + d.timeline.filter(b=>b.type==='meal_placeholder').length, 0);

  // ===== 天数硬校验 =====
  // 即使 prompt 说了 N 天，AI 偶尔还是会失控（返回 8 天）；这里硬截断
  let final_days = days;
  let day_truncated = false;
  if(days.length > intake.days){
    final_days = days.slice(0, intake.days);
    day_truncated = true;
    console.warn('[itinerary] AI 返回', days.length, '天，截断到', intake.days, '天');
  }

  dbgPush({
    kind: 'ai_itinerary_parsed',
    intake,
    liked_count: liked.length,
    maybe_count: maybe.length,
    days_returned: (parsed.days||[]).length,
    days_after_truncate: final_days.length,
    day_truncated,                                // ★ 是否被截断（说明 AI 没听话）
    ai_returned_poi_count: _dbg.ai_returned_poi_ids.length,
    poi_in_plan_after_parse: total_poi_in_plan,
    meal_in_plan: total_meal_in_plan,
    liked_not_used,                              // ★ 用户挑了但 AI 没排进去的
    dropped_poi_ids: _dbg.dropped_poi_ids,        // ★ AI 返了但 id 对不上被丢弃的
    invalid_time_items: _dbg.invalid_time_items,
    invalid_time_meals: _dbg.invalid_time_meals,
    overall_tip: parsed.overall_tip,
    raw_ai_response: parsed,                     // 完整 AI JSON
    request_user_prompt: user,                   // 完整 prompt（方便对照）
  });

  return { days: final_days, overallTip: parsed.overall_tip || '' };
}


/* ---------- 空态：等数据 ---------- */
function DataPending({err}){
  return (
    <div className="max-w-xl mx-auto px-5 py-20 text-center">
      <div className="font-mono text-[11px] text-accent tracking-widest mb-2">// LOADING</div>
      <h2 className="font-serif text-2xl font-bold">数据整理中</h2>
      <p className="text-sm text-muted mt-3 leading-relaxed">
        研究 Agent 正在爬取并整理 50 个曼谷 POI 数据……<br/>
        完成后会写入 <span className="font-mono text-ink">data/bangkok-pois.json</span>，刷新页面即可看到。
      </p>
      {err && <div className="mt-6 p-4 bg-paper border border-line rounded-xl text-xs text-muted font-mono text-left">{err}</div>}
      <button onClick={()=>location.reload()} className="mt-8 px-6 py-3 btn-primary rounded-xl text-sm font-serif font-bold">刷新重试</button>
    </div>
  );
}

/* ---------- 主 App ---------- */
function App(){
  const {data,err} = usePois();
  const [step,setStep] = useState(0);
  const [intake,setIntake] = useState(null);
  const [swipeResult,setSwipeResult] = useState(null);
  // 预处理后的最终 list（如果走预处理）
  const [finalLiked,setFinalLiked] = useState(null);
  const [finalMaybe,setFinalMaybe] = useState(null);

  const reset = ()=>{setStep(0); setIntake(null); setSwipeResult(null); setFinalLiked(null); setFinalMaybe(null);};

  if(!data) return <><Header step={0} total={3}/><DataPending err={err}/><DebugPanel/></>;

  // 判断是否需要走预处理（超量）：每天上限按 pace 来
  const paceUpper = (intake?.pace === 'chill') ? 4 : (intake?.pace === 'intense' ? 8 : 6);
  const dayCount = intake?.days || 3;
  const upper = paceUpper * dayCount;
  const needPreCheck = swipeResult && swipeResult.liked.length > upper;

  // 滑卡完成回调：如果超量进 step=2 预处理，否则直接进 step=3 最终行程
  const onSwipeDone = (r)=>{
    setSwipeResult(r);
    const overflow = r.liked.length > (paceUpper * dayCount);
    if(overflow){
      setStep(2);
    } else {
      setFinalLiked(r.liked); setFinalMaybe(r.maybe);
      setStep(3);
    }
  };
  const onPreCheckDone = (liked, maybe)=>{
    setFinalLiked(liked); setFinalMaybe(maybe);
    setStep(3);
  };

  return (
    <div className="min-h-screen">
      <Header
        step={step+1}
        total={needPreCheck ? 4 : 3}
        onBack={step>0?()=>setStep(s=>Math.max(0,s-1)):null}
        right={step===1 ? <span/> : null}/>

      {step===0 && (
        <StepIntake onDone={(v)=>{setIntake(v); setStep(1);}}/>
      )}
      {step===1 && intake && (
        <StepSwipe pois={data.pois} onDone={onSwipeDone}/>
      )}
      {step===2 && swipeResult && intake && (
        <StepPreCheck
          intake={intake}
          liked={swipeResult.liked}
          maybe={swipeResult.maybe}
          allPois={data.pois}
          onDone={onPreCheckDone}/>
      )}
      {step===3 && intake && finalLiked && (
        <StepItinerary
          intake={intake}
          liked={finalLiked}
          maybe={finalMaybe || []}
          onRestart={reset}
          allPois={data.pois}/>
      )}
      <DebugPanel/>
    </div>
  );
}

/* ---------- DEBUG 浮窗 ---------- */
function DebugPanel(){
  const [open,setOpen] = useState(false);
  const [, force] = useState(0);
  useEffect(()=>{
    const h = ()=>force(x=>x+1);
    window.addEventListener('swipego-debug-update', h);
    return ()=>window.removeEventListener('swipego-debug-update', h);
  },[]);
  const logs = window.__SWIPEGO_DEBUG__.logs;
  const last = logs[logs.length-1];
  // 找最近一次 ai_itinerary_parsed 用于亮指标
  const lastParsed = [...logs].reverse().find(l=>l.kind==='ai_itinerary_parsed');

  const copyAll = async ()=>{
    try {
      const text = JSON.stringify(window.__SWIPEGO_DEBUG__.logs, null, 2);
      await navigator.clipboard.writeText(text);
      alert('✅ 已复制 ' + logs.length + ' 条日志到剪贴板（粘贴到对话窗口给我看）');
    } catch(e){
      // 降级：弹窗显示
      const w = window.open('','_blank');
      w.document.write('<pre style="font:12px monospace;padding:20px;white-space:pre-wrap;">'+
        JSON.stringify(window.__SWIPEGO_DEBUG__.logs,null,2).replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]))+'</pre>');
    }
  };
  const clearAll = ()=>{ window.__SWIPEGO_DEBUG__.logs = []; force(x=>x+1); };

  // 上传到云端 KV
  const [uploading,setUploading] = useState(false);
  const uploadCloud = async ()=>{
    if(!DEBUG_UPLOAD_BASE){
      alert('❌ 还没配置云端日志地址（DEBUG_UPLOAD_BASE 变量为空）。先用"📋 复制全部"将就一下。');
      return;
    }
    setUploading(true);
    try {
      const payload = {
        ua: navigator.userAgent,
        url: location.href,
        ts: new Date().toISOString(),
        logs: window.__SWIPEGO_DEBUG__.logs,
      };
      const res = await fetch(DEBUG_UPLOAD_BASE.replace(/\/$/,'') + '/log/upload', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify(payload),
      });
      const j = await res.json().catch(()=>({}));
      if(!res.ok){
        alert('❌ 上传失败 ' + res.status + ': ' + (j.error?.message || ''));
      } else {
        alert('✅ 已上传到云端\n\nkey: ' + j.key + '\n大小: ' + j.size + ' bytes\n\n把这个 key 发给我，我立刻去拉取看现场');
      }
    } catch(e){
      alert('❌ 上传异常：' + (e.message || e));
    } finally {
      setUploading(false);
    }
  };

  // 红点提示：有"漏排"或"丢弃"时
  const hasIssue = lastParsed && (
    (lastParsed.liked_not_used||[]).length>0 ||
    (lastParsed.dropped_poi_ids||[]).length>0
  );

  if(!open){
    return (
      <button onClick={()=>setOpen(true)}
        style={{position:'fixed',right:14,bottom:14,zIndex:9999,
          width:48,height:48,borderRadius:24,background:hasIssue?'#FF6B35':'#0F3D2E',
          color:'#fff',border:'none',boxShadow:'0 4px 14px rgba(0,0,0,.25)',
          fontSize:20,cursor:'pointer'}}>
        🐞{logs.length>0 && <span style={{
          position:'absolute',top:-2,right:-2,minWidth:18,height:18,padding:'0 4px',
          background:'#fff',color:'#0F3D2E',borderRadius:9,fontSize:10,fontWeight:700,
          lineHeight:'18px',display:'inline-block'}}>{logs.length}</span>}
      </button>
    );
  }

  return (
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.5)',zIndex:9999,
      display:'flex',justifyContent:'flex-end'}} onClick={()=>setOpen(false)}>
      <div onClick={e=>e.stopPropagation()} style={{
        width:'min(560px,92vw)',background:'#FAF7F0',height:'100%',overflow:'auto',
        padding:18,fontFamily:'ui-monospace,monospace',fontSize:11,color:'#0F3D2E'}}>
        <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:14,flexWrap:'wrap'}}>
          <strong style={{fontSize:14,fontFamily:'ui-serif,serif'}}>🐞 调试日志</strong>
          <span style={{color:'#6B7A70'}}>{logs.length} 条</span>
          <span style={{flex:1}}/>
          <button onClick={uploadCloud} disabled={uploading} style={{background:'#FF6B35',color:'#fff',border:'none',padding:'6px 10px',borderRadius:6,cursor:'pointer',fontSize:11,fontWeight:700}}>
            {uploading ? '上传中…' : '☁️ 上传到云端'}
          </button>
          <button onClick={copyAll} style={{background:'#0F3D2E',color:'#fff',border:'none',padding:'6px 10px',borderRadius:6,cursor:'pointer',fontSize:11}}>📋 复制</button>
          <button onClick={clearAll} style={{background:'#fff',border:'1px solid #D9D2BF',padding:'6px 10px',borderRadius:6,cursor:'pointer',fontSize:11}}>清空</button>
          <button onClick={()=>setOpen(false)} style={{background:'#fff',border:'1px solid #D9D2BF',padding:'6px 10px',borderRadius:6,cursor:'pointer',fontSize:11}}>×</button>
        </div>

        {lastParsed && (
          <div style={{padding:12,background:'#fff',border:'2px solid '+(hasIssue?'#FF6B35':'#0F3D2E'),borderRadius:10,marginBottom:14}}>
            <div style={{fontWeight:700,marginBottom:6,fontSize:12}}>📊 最近一次行程生成</div>
            <div>用户挑了 (liked): <b>{lastParsed.liked_count}</b></div>
            <div>AI 返回 POI 总数: <b>{lastParsed.ai_returned_poi_count}</b></div>
            <div>解析后真正进入行程: <b>{lastParsed.poi_in_plan_after_parse}</b></div>
            <div>AI 排了几天: <b>{lastParsed.days_returned}</b></div>
            <div>吃饭坑位: <b>{lastParsed.meal_in_plan}</b></div>
            {(lastParsed.liked_not_used||[]).length>0 && (
              <div style={{marginTop:8,padding:8,background:'#FFF3E0',borderRadius:6,color:'#FF6B35'}}>
                ⚠️ 用户挑了 AI 没排（{lastParsed.liked_not_used.length}）：<br/>
                {lastParsed.liked_not_used.join(', ')}
              </div>
            )}
            {(lastParsed.dropped_poi_ids||[]).length>0 && (
              <div style={{marginTop:8,padding:8,background:'#FFE0E0',borderRadius:6,color:'#C00'}}>
                ❌ AI 返回但 id 对不上被丢弃（{lastParsed.dropped_poi_ids.length}）：<br/>
                {lastParsed.dropped_poi_ids.join(', ')}
              </div>
            )}
          </div>
        )}

        <div style={{marginTop:8}}>
          {[...logs].reverse().map((l,i)=>(
            <details key={i} style={{marginBottom:6,padding:8,background:'#fff',borderRadius:6,border:'1px solid #D9D2BF'}}>
              <summary style={{cursor:'pointer',fontWeight:700}}>
                <span style={{color:'#FF6B35'}}>{l.kind}</span>
                <span style={{color:'#6B7A70',marginLeft:8,fontWeight:400}}>{(l.ts||'').slice(11,19)}</span>
              </summary>
              <pre style={{whiteSpace:'pre-wrap',wordBreak:'break-all',marginTop:6,fontSize:10,color:'#3a4a40'}}>{JSON.stringify(l,null,2)}</pre>
            </details>
          ))}
          {logs.length===0 && <div style={{color:'#6B7A70',padding:20,textAlign:'center'}}>暂无日志，跑一次行程就有了</div>}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
