<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<title>SwipeGo · 曼谷小时级攻略</title>
<meta name="description" content="J人专属·小时级曼谷旅游规划" />
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&family=JetBrains+Mono:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --ink:#0F3D2E;        /* 深墨绿 */
    --ink-2:#1A5240;
    --cream:#FAF7F0;      /* 奶油白 */
    --paper:#F2EDE0;
    --accent:#FF6B35;     /* 曼谷橙 */
    --line:#D9D2BF;
    --muted:#6B7A70;
  }
  html,body{background:var(--cream);color:var(--ink);font-family:Inter,'Noto Serif SC',system-ui,sans-serif;}
  .font-serif{font-family:'Noto Serif SC',serif;letter-spacing:.02em;}
  .font-mono{font-family:'JetBrains Mono',ui-monospace,monospace;}
  .bg-ink{background:var(--ink);} .text-ink{color:var(--ink);}
  .bg-cream{background:var(--cream);} .bg-paper{background:var(--paper);}
  .border-line{border-color:var(--line);}
  .text-accent{color:var(--accent);} .bg-accent{background:var(--accent);}
  .text-muted{color:var(--muted);}
  /* 网格纸背景，强化"清单"感 */
  .grid-paper{
    background-image:
      linear-gradient(var(--line) 1px,transparent 1px),
      linear-gradient(90deg,var(--line) 1px,transparent 1px);
    background-size: 32px 32px;
    background-color:var(--cream);
    opacity:.35;
  }
  /* 滑动卡阴影 */
  .card-shadow{box-shadow:0 1px 0 rgba(15,61,46,.08),0 20px 40px -16px rgba(15,61,46,.35);}
  /* 打勾动画 */
  @keyframes tickIn{from{transform:scale(.2) rotate(-20deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
  .tick-in{animation:tickIn .3s cubic-bezier(.2,.8,.2,1);}
  /* 隐藏滚动条 */
  .no-scrollbar::-webkit-scrollbar{display:none}
  .no-scrollbar{-ms-overflow-style:none;scrollbar-width:none}
  /* 时间轴点 */
  .dot{width:10px;height:10px;border-radius:9999px;background:var(--ink);box-shadow:0 0 0 3px var(--cream),0 0 0 4px var(--ink);}
  .btn-primary{background:var(--ink);color:var(--cream);}
  .btn-primary:hover{background:var(--ink-2);}
  /* 详情抽屉动画 */
  @keyframes sheetFade{from{opacity:0}to{opacity:1}}
  @keyframes sheetUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
  .sheet-fade{animation:sheetFade .25s ease-out}
  .sheet-up{animation:sheetUp .32s cubic-bezier(.2,.8,.2,1)}
  /* safe area */
  .pb-safe{padding-bottom:calc(env(safe-area-inset-bottom,0) + 1rem);}
  .pt-safe{padding-top:calc(env(safe-area-inset-top,0) + 1rem);}
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef, useCallback } = React;

/* ---------- 数据加载 ---------- */
function usePois(){
  const [data,setData] = useState(null);
  const [err,setErr] = useState(null);
  useEffect(()=>{
    fetch('./data/bangkok-pois.json?v='+Date.now())
      .then(r=>{ if(!r.ok) throw new Error('poi 数据还没就绪，研究 Agent 正在整理'); return r.json(); })
      .then(setData)
      .catch(e=>setErr(e.message));
  },[]);
  return {data,err};
}

/* ---------- 小工具 ---------- */
const CAT_META = {
  landmark:  {label:'地标寺庙', icon:'🏛'},
  food:      {label:'美食',     icon:'🍜'},
  market:    {label:'市集购物', icon:'🛍'},
  nightlife: {label:'夜生活',   icon:'🌃'},
  niche:     {label:'小众文艺', icon:'🛕'},
  spa:       {label:'SPA体验',  icon:'💆'},
  nature:    {label:'自然公园', icon:'🌳'},
  art:       {label:'文艺艺术', icon:'🎨'},
  cafe:      {label:'咖啡甜品', icon:'☕'},
  mall:      {label:'商场购物', icon:'🏬'},
  hidden:    {label:'小众秘境', icon:'🗺'},
  family:    {label:'亲子游乐', icon:'🦁'},
};
const TIME_META = {
  morning:{label:'清晨',range:'06-11'},
  noon:{label:'午间',range:'11-14'},
  afternoon:{label:'午后',range:'14-17'},
  evening:{label:'傍晚',range:'17-20'},
  night:{label:'夜间',range:'20-24'},
};

/* ---------- 顶部 Header ---------- */
function Header({step,total,onBack,right}){
  return (
    <header className="sticky top-0 z-20 bg-cream/90 backdrop-blur border-b border-line">
      <div className="max-w-xl mx-auto px-5 pt-safe pb-3 flex items-center justify-between gap-3">
        <div className="flex items-center gap-2 min-w-0">
          {onBack && (
            <button onClick={onBack} className="w-8 h-8 shrink-0 grid place-items-center rounded-full border border-line text-ink/80 hover:bg-paper">←</button>
          )}
          <div className="leading-tight min-w-0">
            <div className="font-serif text-lg font-bold tracking-tight">SwipeGo</div>
            <div className="font-mono text-[10px] text-muted -mt-0.5 truncate">BANGKOK · 小时级清单</div>
          </div>
        </div>
        {right ? right : (
          <div className="font-mono text-[11px] text-muted shrink-0">
            STEP <span className="text-ink font-bold">{step}</span> / {total}
          </div>
        )}
      </div>
    </header>
  );
}

/* ---------- STEP 0: 开场问卷（仅天数） ---------- */
function StepIntake({onDone}){
  const [days,setDays] = useState(null);

  const choose = (v)=>{
    setDays(v);
    // 点完直接进入下一步，默认 09:00 / standard 强度（清单页可后续调整）
    setTimeout(()=>onDone({days:v, wake:'09:00', pace:'standard'}), 220);
  };

  const options = [
    {v:2,label:'2 天',sub:'极限周末'},
    {v:3,label:'3 天',sub:'黄金节奏'},
    {v:4,label:'4 天',sub:'推荐'},
    {v:5,label:'5 天',sub:'深度'},
    {v:6,label:'6 天',sub:'慢游'},
    {v:7,label:'7 天+',sub:'定居感'},
  ];

  return (
    <div className="max-w-xl mx-auto px-5 pt-6 pb-10">
      <div className="mb-8">
        <div className="font-mono text-[11px] text-accent tracking-widest mb-2">// 01 INTAKE</div>
        <h2 className="font-serif text-3xl font-bold leading-tight">你打算待几天？</h2>
        <p className="text-sm text-muted mt-2">SwipeGo 会按天给你排出小时级清单</p>
      </div>

      <div className="grid grid-cols-2 gap-3">
        {options.map(o=>{
          const active = days===o.v;
          return (
            <button key={o.v} onClick={()=>choose(o.v)}
              className={`relative p-5 rounded-2xl border-2 text-left transition ${active?'bg-ink text-cream border-ink scale-[0.98] shadow-md':'bg-paper border-line hover:border-ink/40 active:scale-[0.98]'}`}>
              <div className="font-serif font-bold text-2xl">{o.label}</div>
              <div className={`text-xs mt-1 ${active?'text-cream/85':'text-muted'}`}>{o.sub}</div>
              {active && <span className="absolute top-3 right-3 text-base tick-in text-cream">✓</span>}
            </button>
          );
        })}
      </div>

      <p className="font-mono text-[10px] text-muted text-center mt-8 tracking-wider">
        SWIPE TO PLAN · 左滑跳过 · 右滑想去 · 下滑待定
      </p>
    </div>
  );
}

/* ---------- STEP 1: 刷 POI 卡 ---------- */
function StepSwipe({pois,onDone}){
  const [idx,setIdx] = useState(0);
  const [decisions,setDecisions] = useState({}); // id => 'like' | 'pass' | 'maybe'
  const [history,setHistory] = useState([]);     // [{idx, poiId, verb}]，用于撤销
  const [openDetail,setOpenDetail] = useState(null);
  const [openShortlist,setOpenShortlist] = useState(false);
  const [drag,setDrag] = useState({x:0,y:0,active:false});
  const [exiting,setExiting] = useState(null); // {dir, verb}
  const [skipTransition,setSkipTransition] = useState(false);
  const startRef = useRef(null);

  const current = pois[idx];
  const next = pois[idx+1];

  const decide = (verb)=>{
    if(!current || exiting) return;
    // 飞出去的方向
    const dir = verb==='like'?{x:600,y:-50}:verb==='pass'?{x:-600,y:-50}:{x:0,y:600};
    setExiting({dir,verb});
    const snapshotIdx = idx;
    const snapshotPoi = current;
    setTimeout(()=>{
      setSkipTransition(true);
      setDecisions(prev=>({...prev,[snapshotPoi.id]:verb}));
      setHistory(h=>[...h, {idx:snapshotIdx, poiId:snapshotPoi.id, verb}]);
      setIdx(i=>i+1);
      setDrag({x:0,y:0,active:false});
      setExiting(null);
      requestAnimationFrame(()=>requestAnimationFrame(()=>setSkipTransition(false)));
    },220);
  };

  const undo = ()=>{
    if(history.length === 0 || exiting) return;
    const last = history[history.length-1];
    setHistory(h=>h.slice(0,-1));
    setSkipTransition(true);
    setDecisions(prev=>{
      const next = {...prev};
      delete next[last.poiId];
      return next;
    });
    setIdx(last.idx);
    setDrag({x:0,y:0,active:false});
    setExiting(null);
    requestAnimationFrame(()=>requestAnimationFrame(()=>setSkipTransition(false)));
  };

  // 修改某个 POI 的决定（清单里用）
  const updateDecision = (poiId, newVerb)=>{
    setDecisions(prev=>{
      if(!newVerb){ const n={...prev}; delete n[poiId]; return n; }
      return {...prev, [poiId]: newVerb};
    });
  };

  const onPointerDown = (e)=>{
    if(exiting) return;
    e.currentTarget.setPointerCapture(e.pointerId);
    startRef.current = {x:e.clientX, y:e.clientY};
    setDrag({x:0,y:0,active:true});
  };
  const onPointerMove = (e)=>{
    if(!startRef.current) return;
    const dx = e.clientX - startRef.current.x;
    const dy = e.clientY - startRef.current.y;
    setDrag({x:dx,y:dy,active:true});
  };
  const onPointerUp = (e)=>{
    if(!startRef.current) return;
    const {x,y} = drag;
    const moved = Math.hypot(x,y);
    startRef.current = null;
    if(x > 110)      decide('like');
    else if(x < -110) decide('pass');
    else if(y > 110)  decide('maybe');
    else if(moved < 8) {
      // 视为点击 → 打开详情
      setOpenDetail(current);
      setDrag({x:0,y:0,active:false});
    }
    else setDrag({x:0,y:0,active:false});
  };

  // 全部刷完不自动跳，让用户去清单里点"开始规划"
  // （撤销后也能继续操作）

  const doneCount = Object.keys(decisions).length;
  const likeCount = Object.values(decisions).filter(v=>v==='like').length;
  const maybeCount = Object.values(decisions).filter(v=>v==='maybe').length;
  const allDone = idx >= pois.length;

  // 触发规划
  const startPlanning = ()=>{
    const liked = pois.filter(p=>decisions[p.id]==='like');
    const maybe = pois.filter(p=>decisions[p.id]==='maybe');
    if(liked.length + maybe.length === 0) return;
    onDone({liked,maybe,decisions});
  };

  if(!current && !allDone){
    return <div className="p-10 text-center text-muted">整理中...</div>;
  }

  // 计算变换
  const tx = exiting ? exiting.dir.x : drag.x;
  const ty = exiting ? exiting.dir.y : drag.y;
  const rot = Math.max(-22,Math.min(22, tx*0.08));
  const cardStyle = {
    transform:`translate(${tx}px, ${ty}px) rotate(${rot}deg)`,
    transition: (drag.active && !exiting) || skipTransition ? 'none'
                : exiting ? 'transform .22s cubic-bezier(.32,.72,.42,1)'
                : 'transform .22s cubic-bezier(.2,.8,.2,1)',
    touchAction:'none',
    willChange:'transform',
  };
  const likeOp = Math.max(0,Math.min(1,(drag.x-20)/100));
  const passOp = Math.max(0,Math.min(1,(-drag.x-20)/100));
  const maybeOp = Math.max(0,Math.min(1,(drag.y-20)/100));

  return (
    <div className="max-w-xl mx-auto px-5 pt-4 pb-6">
      {/* 进度 */}
      <div className="mb-3 flex items-center justify-between text-[11px] font-mono text-muted">
        <span>{doneCount} / {pois.length}</span>
        <span className="text-accent">♥ 想去 {likeCount}</span>
      </div>
      <div className="h-1 bg-paper rounded-full overflow-hidden mb-5">
        <div className="h-full bg-ink transition-all" style={{width:`${(doneCount/pois.length)*100}%`}}/>
      </div>

      {/* 卡堆 / 完成态 */}
      <div className="relative select-none" style={{height:'min(640px, calc(100vh - 220px))'}}>
        {!allDone && (
          <>
            {next && <PoiCard poi={next} stacked/>}
            <div
              className="absolute inset-0"
              style={cardStyle}
              onPointerDown={onPointerDown}
              onPointerMove={onPointerMove}
              onPointerUp={onPointerUp}
              onPointerCancel={onPointerUp}>
              <PoiCard poi={current} instant={skipTransition} onTapDetail={()=>setOpenDetail(current)} />
              <div style={{opacity:likeOp}} className="absolute top-8 right-6 px-3 py-1 border-2 border-accent text-accent rounded font-serif font-bold rotate-12 pointer-events-none">想去 ♥</div>
              <div style={{opacity:passOp}} className="absolute top-8 left-6 px-3 py-1 border-2 border-ink text-ink rounded font-serif font-bold -rotate-12 pointer-events-none">没兴趣</div>
              <div style={{opacity:maybeOp}} className="absolute bottom-24 left-1/2 -translate-x-1/2 px-3 py-1 border-2 border-muted text-muted rounded font-serif font-bold pointer-events-none">待定 ⌛</div>
            </div>
          </>
        )}
        {allDone && (
          <div className="absolute inset-0 rounded-3xl bg-paper border border-line flex flex-col items-center justify-center p-6 text-center">
            <div className="text-5xl mb-3">🎉</div>
            <div className="font-serif text-xl font-bold mb-2">全部刷完了</div>
            <div className="text-sm text-muted leading-relaxed">
              选了 <span className="text-accent font-bold">{likeCount}</span> 个想去
              {maybeCount>0 && <> · <span className="font-bold text-ink">{maybeCount}</span> 个待定</>}
              <br/>点右上角"清单"查看 / 调整 / 开始规划
            </div>
            <button onClick={undo}
              className="mt-6 px-4 py-2 rounded-full border border-line text-sm font-mono">
              ↶ 撤销上一张
            </button>
          </div>
        )}
      </div>

      {/* 按钮操作区 — 带撤销 */}
      <div className="flex items-center justify-around mt-5 px-2">
        <button onClick={undo} disabled={history.length===0}
          className={`flex flex-col items-center gap-1.5 transition ${history.length===0?'opacity-30 cursor-not-allowed':'active:scale-95'}`} title="撤销上一张">
          <span className="w-12 h-12 rounded-full border-2 border-line grid place-items-center text-base text-muted bg-cream">↶</span>
          <span className="font-serif text-[11px] text-muted">撤销</span>
        </button>
        <button onClick={()=>decide('pass')} disabled={allDone}
          className={`flex flex-col items-center gap-1.5 transition ${allDone?'opacity-30':'active:scale-95'}`} title="左滑：不感兴趣">
          <span className="w-14 h-14 rounded-full border-2 border-ink grid place-items-center text-xl bg-cream">✕</span>
          <span className="font-serif text-xs text-ink">没兴趣</span>
        </button>
        <button onClick={()=>decide('maybe')} disabled={allDone}
          className={`flex flex-col items-center gap-1.5 transition ${allDone?'opacity-30':'active:scale-95'}`} title="下滑：待定">
          <span className="w-14 h-14 rounded-full border-2 border-line grid place-items-center text-base text-muted bg-cream">⌛</span>
          <span className="font-serif text-xs text-muted">待定</span>
        </button>
        <button onClick={()=>decide('like')} disabled={allDone}
          className={`flex flex-col items-center gap-1.5 transition ${allDone?'opacity-30':'active:scale-95'}`} title="右滑：想去">
          <span className="w-14 h-14 rounded-full bg-accent text-white grid place-items-center text-xl shadow-lg">♥</span>
          <span className="font-serif text-xs text-accent font-bold">想去</span>
        </button>
      </div>

      {/* 右上角：景点清单按钮 */}
      <button
        onClick={()=>setOpenShortlist(true)}
        className={`fixed right-4 z-30 px-3 py-1.5 rounded-full font-serif text-xs shadow-md transition flex items-center gap-1.5 border-2
          ${likeCount + maybeCount === 0
            ? 'bg-cream text-ink/70 border-line'
            : 'bg-ink text-cream border-ink active:scale-95'}`}
        style={{top:'calc(env(safe-area-inset-top,0px) + 14px)'}}>
        <span>📋 我的清单</span>
        <span className={`font-mono text-[10px] rounded-full px-1.5 py-0.5 leading-none font-bold ${likeCount+maybeCount===0?'bg-line text-ink/70':'bg-accent text-white'}`}>
          {likeCount + maybeCount}
        </span>
      </button>

      {openDetail && <PoiDetail poi={openDetail} onClose={()=>setOpenDetail(null)}/>}
      {openShortlist && (
        <ShortlistSheet
          pois={pois}
          decisions={decisions}
          onUpdate={updateDecision}
          onClose={()=>setOpenShortlist(false)}
          onPlan={()=>{ setOpenShortlist(false); startPlanning(); }}/>
      )}
    </div>
  );
}

function PoiCover({poi, h='h-64'}){
  const [failed,setFailed] = useState(false);
  const url = poi.cover_url;
  const meta = CAT_META[poi.category] || {label:poi.category,icon:'📍'};
  const showImage = url && !failed;
  return (
    <div className={`relative ${h} overflow-hidden`} style={{background:poi.color||'#0F3D2E'}}>
      {showImage && (
        <img src={url} alt={poi.name_zh}
          className="absolute inset-0 w-full h-full object-cover"
          loading="lazy"
          onError={()=>setFailed(true)}/>
      )}
      {!showImage && (
        <>
          {/* 装饰网格 */}
          <div className="absolute inset-0 opacity-15"
            style={{backgroundImage:'linear-gradient(rgba(255,255,255,.6) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.6) 1px,transparent 1px)',backgroundSize:'28px 28px'}}/>
          {/* 大 emoji 当装饰 */}
          <div className="absolute -right-4 -bottom-6 text-[180px] leading-none opacity-25 select-none">{poi.icon||meta.icon}</div>
        </>
      )}
    </div>
  );
}

function PoiCard({poi,stacked,onTapDetail,instant}){
  const meta = CAT_META[poi.category] || {label:poi.category,icon:'📍'};
  return (
    <div className="absolute inset-0 rounded-3xl card-shadow overflow-hidden border border-line bg-ink"
      style={{
        transform: stacked ? 'scale(0.94) translateY(14px)' : 'scale(1) translateY(0)',
        opacity: stacked ? 0.7 : 1,
        transition: instant ? 'none' : 'transform .28s cubic-bezier(.2,.8,.2,1), opacity .28s ease',
      }}>
      {/* 整张大图作为背景 */}
      <PoiCover poi={poi} h="h-full"/>

      {/* 顶部品类 chip — 仅一个 */}
      <div className="absolute top-4 left-4 right-4 flex items-start text-white pointer-events-none">
        <span className="px-3 py-1.5 bg-black/45 backdrop-blur-sm rounded-full font-mono text-[11px] tracking-wider">
          {meta.icon} {meta.label}
        </span>
      </div>

      {/* 底部信息层 — 局部渐变只盖文字区，不盖整图 */}
      <div className="absolute left-0 right-0 bottom-0 pt-20 px-5 pb-5 text-white pointer-events-none"
        style={{background:'linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,.7) 50%, rgba(0,0,0,.92) 100%)'}}>
        <div className="font-mono text-[10px] opacity-85 tracking-widest mb-1.5">
          {poi.district_zh||poi.district}
        </div>
        <h3 className="font-serif text-3xl font-bold leading-tight" style={{textShadow:'0 2px 12px rgba(0,0,0,.6)'}}>{poi.name_zh}</h3>
        <p className="text-[11px] opacity-80 font-mono mt-0.5">{poi.name_en}</p>

        <p className="text-[13px] leading-snug mt-3 opacity-95 line-clamp-2" style={{textShadow:'0 1px 6px rgba(0,0,0,.5)'}}>{poi.short_desc}</p>

        {/* 三栏元信息：背景半透明放在图上 */}
        <div className="grid grid-cols-3 gap-2 mt-4 bg-black/35 backdrop-blur-sm rounded-2xl px-3 py-2.5 border border-white/10">
          <BigMetaCell icon="⏱" label="停留" value={`${poi.duration_hr}h`}/>
          <BigMetaCell icon="☀️" label="时段" value={(poi.best_time||[]).map(t=>TIME_META[t]?.label||t)[0]||'-'}/>
          <BigMetaCell icon="💰" label="人均" value={poi.price_thb?`฿${poi.price_thb}`:'免费'}/>
        </div>
      </div>
    </div>
  );
}

function BigMetaCell({icon,label,value}){
  return (
    <div className="flex flex-col items-center text-center">
      <div className="text-base leading-none mb-0.5">{icon}</div>
      <div className="font-serif text-[15px] font-bold leading-tight text-white">{value}</div>
      <div className="font-mono text-[9px] opacity-70 mt-0.5 tracking-wider">{label}</div>
    </div>
  );
}

function MetaCell({icon,label,value}){
  return (
    <div className="flex items-center gap-1.5">
      <span className="text-base shrink-0">{icon}</span>
      <div className="min-w-0">

        </div>
        <div className="h-2 bg-cream rounded-full overflow-hidden">
          <div className="h-full bg-accent transition-all" style={{width:`${totalItems?(doneCount/totalItems)*100:0}%`}}/>
        </div>

/* ---------- 排程规则引擎 ---------- */
function buildItinerary(liked,intake){
  const days = intake.days;
  const wake = intake.wake; // "07:00"
  const pace = intake.pace; // intense/standard/chill
  const itemsPerDay = {intense:8,standard:6,chill:4}[pace] || 6;

  // 按品类/区域分组，做点简单均衡
  const byDistrict = {};
  liked.forEach(p=>{
    const k = p.district || '_';
    (byDistrict[k] = byDistrict[k] || []).push(p);
  });
  const districtList = Object.values(byDistrict).sort((a,b)=>b.length-a.length);

  // 分配到每天：尽量同区域扎堆
  const buckets = Array.from({length:days},()=>[]);
  let cursor = 0;
  districtList.flat().forEach(p=>{
    // 找一个还能装的桶
    let attempts = 0;
    while(buckets[cursor].length >= itemsPerDay && attempts < days){
      cursor = (cursor+1)%days;
      attempts++;
    }
    if(attempts>=days) buckets[cursor].push(p); // 都满了也塞进去
    else buckets[cursor].push(p);
    cursor = (cursor+1)%days;
  });

  // 每个桶内按 best_time 排序
  const timeRank = {morning:1,noon:2,afternoon:3,evening:4,night:5};
  buckets.forEach(arr=>{
    arr.sort((a,b)=>{
      const ra = Math.min(...(a.best_time||['afternoon']).map(t=>timeRank[t]||3));
      const rb = Math.min(...(b.best_time||['afternoon']).map(t=>timeRank[t]||3));
      return ra-rb;
    });
  });

  // 生成带时间戳的 schedule
  return buckets.map((arr,dayIdx)=>{
    const [wh,wm] = wake.split(':').map(Number);
    let cursorMin = wh*60 + wm;
    const items = [];
    arr.forEach((poi,i)=>{
      // 开餐时间留白：第一个后加 30min 早餐；午饭/晚饭窗口插空
      const start = cursorMin;
      const dur = Math.round((poi.duration_hr||1.5)*60);
      const end = start + dur;
      items.push({poi, start:fmt(start), end:fmt(end)});
      // 间隔：通勤 30min + 必要时加用餐
      let gap = 30;
      if((start<=13*60 && end>=12*60)) gap += 0; // 刚好吃
      cursorMin = end + gap;
    });
    return {dayIdx, items};
  });
}
function fmt(min){
  const h = Math.floor(min/60)%24;
  const m = min%60;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
}

/* ---------- 空态：等数据 ---------- */
function DataPending({err}){
  return (
    <div className="max-w-xl mx-auto px-5 py-20 text-center">
      <div className="font-mono text-[11px] text-accent tracking-widest mb-2">// LOADING</div>
      <h2 className="font-serif text-2xl font-bold">数据整理中</h2>

      </p>
      {err && <div className="mt-6 p-4 bg-paper border border-line rounded-xl text-xs text-muted font-mono text-left">{err}</div>}

}

/* ---------- 主 App ---------- */
function App(){
  const {data,err} = usePois();
  const [step,setStep] = useState(0);
  const [intake,setIntake] = useState(null);
  const [swipeResult,setSwipeResult] = useState(null);

  const reset = ()=>{setStep(0); setIntake(null); setSwipeResult(null);};

  if(!data) return <><Header step={0} total={3}/><DataPending err={err}/></>;

  return (
    <div className="min-h-screen">
      <Header
        step={step+1}
        total={3}
        onBack={step>0?()=>setStep(s=>Math.max(0,s-1)):null}
        right={step===1 ? <span/> : null}/>

      {step===0 && (
        <StepIntake onDone={(v)=>{setIntake(v); setStep(1);}}/>
      )}
      {step===1 && intake && (
        <StepSwipe pois={data.pois} onDone={(r)=>{setSwipeResult(r); setStep(2);}}/>
      )}
      {step===2 && swipeResult && (
        <StepItinerary intake={intake} liked={swipeResult.liked} maybe={swipeResult.maybe} onRestart={reset}/>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
