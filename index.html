<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef, useCallback } = React;

/* ---------- DEBUG 日志系统 ---------- */
// 全局收集每一次 AI 行程调用的"完整现场"，用户可在右下角浮窗里查看 + 一键复制

/* ---------- 数据加载 ---------- */
function usePois(){
  const [data,setData] = useState(null);
  const [err,setErr] = useState(null);
  useEffect(()=>{
    fetch('./data/bangkok-pois.json?v='+Date.now())
      .then(r=>{ if(!r.ok) throw new Error('poi 数据还没就绪，研究 Agent 正在整理'); return r.json(); })
      .then(setData)
      .catch(e=>setErr(e.message));
  },[]);
  return {data,err};
}

/* ---------- 小工具 ---------- */
const CAT_META = {
  landmark:   {label:'地标寺庙', icon:'🏛'},
  restaurant: {label:'特色餐厅', icon:'🍽'},
  streetfood: {label:'街边小吃', icon:'🥘'},
  cafe:       {label:'咖啡甜品', icon:'☕'},
  market:     {label:'市集购物', icon:'🛍'},
  mall:       {label:'商场',     icon:'🏬'},
  nightlife:  {label:'夜生活',   icon:'🌃'},
  spa:        {label:'SPA体验',  icon:'💆'},
  art:        {label:'文艺艺术', icon:'🎨'},
  family:     {label:'亲子游乐', icon:'🦁'},
  hidden:     {label:'小众秘境', icon:'🗺'},
  // 兼容旧数据
  food:       {label:'美食',     icon:'🍜'},
  niche:      {label:'小众文艺', icon:'🛕'},
  nature:     {label:'自然公园', icon:'🌳'},
};
// "吃饭"类（用于固定节奏插入）
const MEAL_CATS = new Set(['restaurant','streetfood']);
// "甜品/咖啡"算辅助餐饮但不算正餐
const SNACK_CATS = new Set(['cafe']);
const TIME_META = {
  morning:{label:'清晨',range:'06-11'},
  noon:{label:'午间',range:'11-14'},
  afternoon:{label:'午后',range:'14-17'},
  evening:{label:'傍晚',range:'17-20'},
  night:{label:'夜间',range:'20-24'},
};

/* ---------- 智能推荐引擎（向量相似度版） ----------
 * 算法：基于内容的推荐（Content-Based Filtering）+ 余弦相似度
 *
 * 1) 每个 POI 编码为 19 维特征向量：
 *    - dim 0-10:  品类 one-hot（11 个品类）
 *    - dim 11-13: 价格档（low ≤200 / mid 200-800 / high >800）
 *    - dim 14-18: 时段（morning/noon/afternoon/evening/night，多选则均分）
 *
 * 2) 用户向量 = sum(like × 2 + maybe × 1)，每次更新后 L2 归一化
 *
 * 3) 评分 = cosine(user, poi) * 12        // 个性化主分（用户喜好越近越高）
 *         + log2(popularity+1) * 1.5       // 热门基础（log 压缩防垄断）
 *         - sameInRecent * 6               // 多样性惩罚
 *         + (seenCount==0 ? 2 : 0)         // 新品类微鼓励
 *         + jitter(±2)
 *
 * 4) 冷启动：用户向量为 0，余弦项为 0，自动退化为 popularity + diversity
 *
 * 5) 加权随机：top5 按分数权重随机抽，避免每次都最高分（增加变化感）
 */
const REC_CATEGORIES = ['landmark','restaurant','streetfood','cafe','market','mall','nightlife','spa','art','family','hidden'];
const TIME_SLOTS = ['morning','noon','afternoon','evening','night'];

function vectorizePoi(poi){
  const v = new Array(19).fill(0);
  // 品类
  const ci = REC_CATEGORIES.indexOf(poi.category);
  if(ci >= 0) v[ci] = 1;
  // 价格
  const price = poi.price_thb || 0;
  if(price <= 200) v[11] = 1;
  else if(price <= 800) v[12] = 1;
  else v[13] = 1;
  // 时段（多选均分）
  const slots = (poi.best_time||[]).filter(t=>TIME_SLOTS.includes(t));
  if(slots.length){
    const w = 1/slots.length;
    slots.forEach(s=>{ v[14+TIME_SLOTS.indexOf(s)] = w; });
  }
  return v;
}

function l2norm(v){
  let s = 0; for(const x of v) s += x*x;
  const n = Math.sqrt(s);
  if(n === 0) return v;
  return v.map(x=>x/n);
}
function cosine(a, b){
  // 假设 b 已归一化或将原始 dot/norm 算出
  let dot = 0, na = 0, nb = 0;
  for(let i=0;i<a.length;i++){
    dot += a[i]*b[i];
    na += a[i]*a[i];
    nb += b[i]*b[i];
  }
  if(na===0 || nb===0) return 0;
  return dot / (Math.sqrt(na)*Math.sqrt(nb));
}

function createRecommender(allPois){
  // 预计算每个 POI 的特征向量
  const poiVec = {};
  allPois.forEach(p=>{ poiVec[p.id] = vectorizePoi(p); });

  const seen = new Set();
  const recent = [];               // 最近抽过的 category，最长 5
  const seenCount = {};
  const userVec = new Array(19).fill(0);  // 累加，未归一化（cosine 自己处理）
  let userTouchedCount = 0;        // 用户右滑/下滑过几张（决定是否冷启动）
  const tasteCount = {};           // 仅用于 stats 调试
  let total = 0;

  // ===== "必看保底" 机制 =====
  // 用户对目的地有预期：前几张没看到经典 = App 不靠谱。
  // 前 N 张走"必看池"，按热度+品类多样性挑，确保覆盖大皇宫/卧佛/恰图恰这种王炸。
  const MUST_SEE_SLOTS = 6;   // 前 6 张是必看槽位
  const MUST_SEE_POP = 9;     // pop>=9 才进必看池
  const mustSeePool = allPois.filter(p => (p.popularity||0) >= MUST_SEE_POP);

  // 用户进入"个性化模式"的门槛：至少 like/maybe 过 2 张
  // 在那之前 cosine 无意义，纯走热度兜底；之后才让 sim 接管
  const isPersonalized = ()=> userTouchedCount >= 2;

  const isMeal = (p)=> MEAL_CATS.has(p.category);

  const computeScore = (p, opts={})=>{
    const cat = p.category;
    const pop = p.popularity || 5;
    const personalized = isPersonalized();

    // 余弦相似度（用户还没明确表达偏好时为 0，避免无意义噪声）
    const sim = personalized ? cosine(userVec, poiVec[p.id]) : 0;

    let score = 0;
    score += sim * 12;                                // 个性化主分
    // 热门基础分：未个性化时权重更高（用户没 like = 一直推热门）
    score += Math.log2(pop+1) * (personalized ? 1.5 : 4.5);
    const sameInRecent = recent.filter(c=>c===cat).length;
    score += -sameInRecent * 6;                       // 多样性
    const seenN = (seenCount[cat]||0);
    if(seenN === 0) score += 2;                       // 新品类微鼓励
    score += (Math.random()-0.5) * 4;                 // 抖动 ±2

    if(opts.mustSee){
      // 必看槽位：极度强化高 pop，且对同品类重罚（保证多样性）
      score += pop * 3;
      score += -sameInRecent * 8;
    } else if(opts.coldStart){
      // 冷启动加强：高 pop 额外加分
      if(pop >= 8) score += 4;
      score += -sameInRecent * 4;                     // 同品类再罚
    }
    return score;
  };

  const recordDecision = (poi, verb)=>{
    const v = poiVec[poi.id];
    if(verb === 'like'){
      for(let i=0;i<v.length;i++) userVec[i] += v[i] * 2;
      userTouchedCount++;
      tasteCount[poi.category] = (tasteCount[poi.category]||0)+2;
    } else if(verb === 'maybe'){
      for(let i=0;i<v.length;i++) userVec[i] += v[i] * 1;
      userTouchedCount++;
      tasteCount[poi.category] = (tasteCount[poi.category]||0)+1;
    }
    // pass 不改变向量（只走 diversity 逻辑）
  };

  const undoDecision = (poi, verb)=>{
    const v = poiVec[poi.id];
    if(verb === 'like'){
      for(let i=0;i<v.length;i++) userVec[i] = Math.max(0, userVec[i] - v[i]*2);
      userTouchedCount = Math.max(0, userTouchedCount-1);
      tasteCount[poi.category] = Math.max(0, (tasteCount[poi.category]||0)-2);
    } else if(verb === 'maybe'){
      for(let i=0;i<v.length;i++) userVec[i] = Math.max(0, userVec[i] - v[i]*1);
      userTouchedCount = Math.max(0, userTouchedCount-1);
      tasteCount[poi.category] = Math.max(0, (tasteCount[poi.category]||0)-1);
    }
  };

  const pickFromPool = (pool, opts)=>{
    if(!pool.length) return null;
    const scored = pool.map(p=>({p, s:computeScore(p,opts)}));
    scored.sort((a,b)=>b.s-a.s);
    // 必看槽位用更尖锐的窗口（top3 抽样），保证经典靠前
    const topK = opts.mustSee ? 3 : 5;
    const topN = scored.slice(0, Math.min(topK, scored.length));
    const sharpness = opts.mustSee ? 3 : 1.5;
    const weights = topN.map((x,i)=>Math.max(0.2, x.s+10-i*sharpness));
    const sum = weights.reduce((a,b)=>a+b,0);
    let r = Math.random()*sum;
    for(let i=0;i<topN.length;i++){
      r -= weights[i];
      if(r<=0) return topN[i].p;
    }
    return topN[0].p;
  };

  const next = ()=>{
    const remaining = allPois.filter(p=>!seen.has(p.id));
    if(!remaining.length) return null;

    // 前 MUST_SEE_SLOTS 张：从必看池里挑（用户未 like 之前完全靠热度+多样性）
    // 这样保证用户进来前 6 张里能看到大皇宫/卧佛/恰图恰这种"目的地经典"
    const inMustSeePhase = total < MUST_SEE_SLOTS;
    const mustRemaining = mustSeePool.filter(p=>!seen.has(p.id));

    let chosen;
    if(inMustSeePhase && mustRemaining.length){
      chosen = pickFromPool(mustRemaining, {mustSee:true});
    } else {
      chosen = pickFromPool(remaining, {coldStart: total<8 || !isPersonalized()});
    }
    if(!chosen) chosen = remaining[0];
    seen.add(chosen.id);
    seenCount[chosen.category] = (seenCount[chosen.category]||0)+1;
    recent.push(chosen.category);
    if(recent.length > 5) recent.shift();
    total++;
    return chosen;
  };

  const peekNext = ()=>{
    const remaining = allPois.filter(p=>!seen.has(p.id));
    return remaining[0] || null;
  };

  const stats = ()=>({
    seen: seen.size,
    total: allPois.length,
    userVec: [...userVec],
    taste: {...tasteCount},
    seenByCat: {...seenCount},
  });

  return { next, peekNext, recordDecision, undoDecision, stats };
}

/* ---------- 顶部 Header ---------- */
function Header({step,total,onBack,right}){
  return (
    <header className="sticky top-0 z-20 bg-cream/90 backdrop-blur border-b border-line">
      <div className="max-w-xl mx-auto px-5 pt-safe pb-3 flex items-center justify-between gap-3">
        <div className="flex items-center gap-2 min-w-0">
          {onBack && (
            <button onClick={onBack} className="w-8 h-8 shrink-0 grid place-items-center rounded-full border border-line text-ink/80 hover:bg-paper">←</button>
          )}
          <div className="leading-tight min-w-0">
            <div className="font-serif text-lg font-bold tracking-tight">SwipeGo</div>
            <div className="font-mono text-[10px] text-muted -mt-0.5 truncate">BANGKOK · 小时级清单</div>
          </div>
        </div>
        {right ? right : (
          <div className="font-mono text-[11px] text-muted shrink-0">
            STEP <span className="text-ink font-bold">{step}</span> / {total}
          </div>
        )}
      </div>
    </header>
  );
}

/* ---------- STEP 0: 开场问卷（仅天数） ---------- */
function StepIntake({onDone}){
  const [days,setDays] = useState(null);

  const choose = (v)=>{
    setDays(v);
    // 点完直接进入下一步，默认 09:00 / standard 强度（清单页可后续调整）
    setTimeout(()=>onDone({days:v, wake:'09:00', pace:'standard'}), 220);
  };

  const options = [
    {v:2,label:'2 天',sub:'极限周末'},
    {v:3,label:'3 天',sub:'黄金节奏'},
    {v:4,label:'4 天',sub:'推荐'},
    {v:5,label:'5 天',sub:'深度'},
    {v:6,label:'6 天',sub:'慢游'},
    {v:7,label:'7 天+',sub:'定居感'},
  ];

  return (
    <div className="max-w-xl mx-auto px-5 pt-6 pb-10">
      <div className="mb-8">
        <div className="font-mono text-[11px] text-accent tracking-widest mb-2">// 01 INTAKE</div>
        <h2 className="font-serif text-3xl font-bold leading-tight">你打算待几天？</h2>
        <p className="text-sm text-muted mt-2">SwipeGo 会按天给你排出小时级清单</p>
      </div>

      <div className="grid grid-cols-2 gap-3">
        {options.map(o=>{
          const active = days===o.v;
          return (
            <button key={o.v} onClick={()=>choose(o.v)}
              className={`relative p-5 rounded-2xl border-2 text-left transition ${active?'bg-ink text-white border-ink scale-[0.98] shadow-md':'bg-cream border-ink/20 text-ink hover:border-ink/50 active:scale-[0.98]'}`}>
              <div className="font-serif font-bold text-2xl">{o.label}</div>
              <div className={`text-xs mt-1 ${active?'text-white/85':'text-muted'}`}>{o.sub}</div>
              {active && <span className="absolute top-3 right-3 text-base tick-in text-white">✓</span>}
            </button>
          );
        })}
      </div>

      <p className="font-mono text-[10px] text-muted text-center mt-8 tracking-wider">
        SWIPE TO PLAN · 左滑跳过 · 右滑想去 · 下滑待定
      </p>
    </div>
  );
}

/* ---------- STEP 1: 刷 POI 卡 ---------- */
function StepSwipe({pois,onDone}){
  // 推荐引擎：每个 mount 创建一次，跨 render 持有状态
  const recoRef = useRef(null);
  if(!recoRef.current) recoRef.current = createRecommender(pois);
  const reco = recoRef.current;

  // queue 始终保持 [current, next, ...]，初始抽 2 张
  const [queue,setQueue] = useState(()=>{
    const a = reco.next(); const b = reco.next();
    return [a,b].filter(Boolean);
  });
  const [decisions,setDecisions] = useState({});
  const [history,setHistory] = useState([]);  // [{poi, verb}] 用于撤销
  const [openDetail,setOpenDetail] = useState(null);
  const [openShortlist,setOpenShortlist] = useState(false);
  const [exiting,setExiting] = useState(null);
  const [imgIdx,setImgIdx] = useState(0);

  // 拖拽用 ref
  const cardRef = useRef(null);
  const labelLikeRef = useRef(null);
  const labelPassRef = useRef(null);
  const labelMaybeRef = useRef(null);
  const dragRef = useRef({x:0,y:0,active:false,startX:0,startY:0});

  const current = queue[0];
  const next = queue[1];

  // 预加载 queue 里下一张 / 下下张的封面，让滑卡几乎瞬间显示
  useEffect(()=>{
    queue.slice(1, 4).forEach(p=>{
      if(!p) return;
      const url = p.cover_url;
      if(!url) return;
      const im = new Image();
      im.decoding = 'async';
      im.src = url;
    });
  }, [queue]);

  // 应用 transform 到 DOM
  const applyTransform = (x,y,withTransition=false)=>{
    const el = cardRef.current;
    if(!el) return;
    const rot = Math.max(-22, Math.min(22, x*0.08));
    el.style.transition = withTransition ? 'transform .28s cubic-bezier(.2,.8,.2,1)' : 'none';
    el.style.transform = `translate3d(${x}px, ${y}px, 0) rotate(${rot}deg)`;
    if(labelLikeRef.current) labelLikeRef.current.style.opacity = Math.max(0, Math.min(1, (x-20)/100));
    if(labelPassRef.current) labelPassRef.current.style.opacity = Math.max(0, Math.min(1, (-x-20)/100));
    if(labelMaybeRef.current) labelMaybeRef.current.style.opacity = Math.max(0, Math.min(1, (y-20)/100));
  };

  const decide = (verb)=>{
    if(!current || exiting) return;
    const dir = verb==='like'?{x:700,y:-80}:verb==='pass'?{x:-700,y:-80}:{x:0,y:800};
    setExiting({dir,verb});
    const el = cardRef.current;
    if(el){
      const rot = verb==='like'?22:verb==='pass'?-22:0;
      el.style.transition = 'transform .26s cubic-bezier(.32,.72,.42,1), opacity .26s ease';
      el.style.transform = `translate3d(${dir.x}px, ${dir.y}px, 0) rotate(${rot}deg)`;
      el.style.opacity = '0';
    }
    const snapshotPoi = current;
    setTimeout(()=>{
      // 通知推荐引擎并抽下一张
      reco.recordDecision(snapshotPoi, verb);
      setDecisions(prev=>({...prev, [snapshotPoi.id]:verb}));
      setHistory(h=>[...h, {poi:snapshotPoi, verb}]);
      // queue 出列 + 补充
      setQueue(q=>{
        const newNext = reco.next();
        const arr = q.slice(1);
        if(newNext) arr.push(newNext);
        return arr;
      });
      setImgIdx(0);
      setExiting(null);
      requestAnimationFrame(()=>{
        const el2 = cardRef.current;
        if(el2){
          el2.style.transition = 'none';
          el2.style.transform = 'translate3d(0,0,0) rotate(0deg)';
          el2.style.opacity = '1';
        }
        if(labelLikeRef.current) labelLikeRef.current.style.opacity = 0;
        if(labelPassRef.current) labelPassRef.current.style.opacity = 0;
        if(labelMaybeRef.current) labelMaybeRef.current.style.opacity = 0;
        dragRef.current = {x:0,y:0,active:false,startX:0,startY:0};
      });
    },260);
  };

  const undo = ()=>{
    if(history.length === 0 || exiting) return;
    const last = history[history.length-1];
    setHistory(h=>h.slice(0,-1));
    setDecisions(prev=>{
      const n = {...prev};
      delete n[last.poi.id];
      return n;
    });
    // 撤销时把卡塞回 queue 头部，让用户再决定一次
    reco.undoDecision(last.poi, last.verb);
    setQueue(q=>[last.poi, ...q]);
    setImgIdx(0);
    setExiting(null);
    requestAnimationFrame(()=>{
      const el = cardRef.current;
      if(el){
        el.style.transition = 'none';
        el.style.transform = 'translate3d(0,0,0) rotate(0deg)';
        el.style.opacity = '1';
      }
    });
  };

  const updateDecision = (poiId, newVerb)=>{
    setDecisions(prev=>{
      if(!newVerb){ const n={...prev}; delete n[poiId]; return n; }
      return {...prev, [poiId]: newVerb};
    });
  };

  const onPointerDown = (e)=>{
    if(exiting) return;
    e.currentTarget.setPointerCapture(e.pointerId);
    dragRef.current = {x:0,y:0,active:true,startX:e.clientX,startY:e.clientY};
    if(cardRef.current) cardRef.current.style.transition = 'none';
  };
  const onPointerMove = (e)=>{
    const d = dragRef.current;
    if(!d.active) return;
    const dx = e.clientX - d.startX;
    const dy = e.clientY - d.startY;
    d.x = dx; d.y = dy;
    applyTransform(dx, dy);
  };
  const onPointerUp = (e)=>{
    const d = dragRef.current;
    if(!d.active) return;
    const {x,y} = d;
    const moved = Math.hypot(x,y);
    d.active = false;
    if(x > 110)      decide('like');
    else if(x < -110) decide('pass');
    else if(y > 110)  decide('maybe');
    else if(moved < 8){
      // 点击：按横向位置分 3 段（左/中/右）
      const el = cardRef.current;
      if(el && current){
        const rect = el.getBoundingClientRect();
        const ratio = (e.clientX - rect.left) / rect.width;
        const total = getPoiImages(current).length;
        if(total > 1 && ratio < 0.32){
          // 左侧：上一张
          setImgIdx(i => (i - 1 + total) % total);
          applyTransform(0, 0, true);
        } else if(total > 1 && ratio > 0.68){
          // 右侧：下一张
          setImgIdx(i => (i + 1) % total);
          applyTransform(0, 0, true);
        } else {
          // 中间：打开详情
          setOpenDetail(current);
          applyTransform(0, 0, true);
        }
      } else {
        applyTransform(0, 0, true);
      }
    }
    else {
      // 弹回
      applyTransform(0, 0, true);
      // 标签也淡出
      [labelLikeRef, labelPassRef, labelMaybeRef].forEach(r=>{
        if(r.current){
          r.current.style.transition = 'opacity .2s';
          r.current.style.opacity = 0;
        }
      });
    }
  };

  // 全部刷完不自动跳，让用户去清单里点"开始规划"
  // （撤销后也能继续操作）

  const doneCount = Object.keys(decisions).length;
  const likeCount = Object.values(decisions).filter(v=>v==='like').length;
  const maybeCount = Object.values(decisions).filter(v=>v==='maybe').length;
  const totalPois = pois.length;
  const allDone = !current; // queue 空 = 没卡可刷了

  // 触发规划
  const startPlanning = ()=>{
    const liked = pois.filter(p=>decisions[p.id]==='like');
    const maybe = pois.filter(p=>decisions[p.id]==='maybe');
    if(liked.length + maybe.length === 0) return;
    onDone({liked,maybe,decisions});
  };

  if(!current && !allDone){
    return <div className="p-10 text-center text-muted">整理中...</div>;
  }

  return (
    <div className="max-w-xl mx-auto px-5 pt-4 pb-6">
      {/* 进度 */}
      <div className="mb-3 flex items-center justify-between text-[11px] font-mono text-muted">
        <span>{doneCount} / {totalPois}</span>
        <span className="text-accent">♥ 想去 {likeCount}</span>
      </div>
      <div className="h-1 bg-paper rounded-full overflow-hidden mb-5">
        <div className="h-full bg-ink transition-all" style={{width:`${(doneCount/totalPois)*100}%`}}/>
      </div>

      {/* 卡堆 / 完成态 */}
      <div className="relative select-none" style={{height:'min(640px, calc(100vh - 220px))'}}>
        {!allDone && (
          <>
            {next && <PoiCard poi={next} stacked/>}
            <div
              ref={cardRef}
              className="absolute inset-0"
              style={{touchAction:'none', willChange:'transform', transform:'translate3d(0,0,0)'}}
              onPointerDown={onPointerDown}
              onPointerMove={onPointerMove}
              onPointerUp={onPointerUp}
              onPointerCancel={onPointerUp}>
              <PoiCard poi={current} onTapDetail={()=>setOpenDetail(current)} imgIdx={imgIdx} />
              <div ref={labelLikeRef} style={{opacity:0}} className="absolute top-8 right-6 px-3 py-1 border-2 border-accent text-accent rounded font-serif font-bold rotate-12 pointer-events-none bg-white">想去 ♥</div>
              <div ref={labelPassRef} style={{opacity:0}} className="absolute top-8 left-6 px-3 py-1 border-2 border-ink text-ink rounded font-serif font-bold -rotate-12 pointer-events-none bg-white">没兴趣</div>
              <div ref={labelMaybeRef} style={{opacity:0}} className="absolute bottom-24 left-1/2 -translate-x-1/2 px-3 py-1 border-2 border-ink text-ink rounded font-serif font-bold pointer-events-none bg-white">待定 ⌛</div>
            </div>
          </>
        )}
        {allDone && (
          <div className="absolute inset-0 rounded-3xl bg-paper border border-line flex flex-col items-center justify-center p-6 text-center">
            <div className="text-5xl mb-3">🎉</div>
            <div className="font-serif text-xl font-bold mb-2">全部刷完了</div>
            <div className="text-sm text-muted leading-relaxed">
              选了 <span className="text-accent font-bold">{likeCount}</span> 个想去
              {maybeCount>0 && <> · <span className="font-bold text-ink">{maybeCount}</span> 个待定</>}
              <br/>点右上角"清单"查看 / 调整 / 开始规划
            </div>
            <button onClick={undo}
              className="mt-6 px-4 py-2 rounded-full border border-line text-sm font-mono">
              ↶ 撤销上一张
            </button>
          </div>
        )}
      </div>

      {/* 按钮操作区 — 带撤销 */}
      <div className="flex items-center justify-around mt-5 px-2">
        <button onClick={undo} disabled={history.length===0}
          className={`flex flex-col items-center gap-1.5 transition ${history.length===0?'opacity-50 cursor-not-allowed':'active:scale-95'}`} title="撤销上一张">
          <span className="w-12 h-12 rounded-full border-2 border-line grid place-items-center text-base text-muted bg-cream">↶</span>
          <span className="font-serif text-[11px] text-muted">撤销</span>
        </button>
        <button onClick={()=>decide('pass')} disabled={allDone}
          className={`flex flex-col items-center gap-1.5 transition ${allDone?'opacity-50':'active:scale-95'}`} title="左滑：不感兴趣">
          <span className="w-14 h-14 rounded-full border-2 border-ink grid place-items-center text-xl bg-cream">✕</span>
          <span className="font-serif text-xs text-ink">没兴趣</span>
        </button>
        <button onClick={()=>decide('maybe')} disabled={allDone}
          className={`flex flex-col items-center gap-1.5 transition ${allDone?'opacity-50':'active:scale-95'}`} title="下滑：待定">
          <span className="w-14 h-14 rounded-full border-2 border-line grid place-items-center text-base text-ink/70 bg-cream">⌛</span>
          <span className="font-serif text-xs text-ink/70">待定</span>
        </button>
        <button onClick={()=>decide('like')} disabled={allDone}
          className={`flex flex-col items-center gap-1.5 transition ${allDone?'opacity-50':'active:scale-95'}`} title="右滑：想去">
          <span className="w-14 h-14 rounded-full bg-accent text-white grid place-items-center text-xl shadow-lg">♥</span>
          <span className="font-serif text-xs text-accent font-bold">想去</span>
        </button>
      </div>

      {/* 右上角：景点清单按钮 — 双层背景保证在任何图上都清晰 */}
      <button
        onClick={()=>setOpenShortlist(true)}
        className={`fixed right-4 z-30 px-3.5 py-2 rounded-full font-serif text-xs font-bold transition flex items-center gap-1.5 active:scale-95
          ${likeCount + maybeCount === 0
            ? 'bg-white text-ink border-2 border-ink/20'
            : 'bg-ink text-white border-2 border-white'}`}
        style={{
          top:'calc(env(safe-area-inset-top,0px) + 14px)',
          boxShadow:'0 4px 14px rgba(0,0,0,.25)',
        }}>
        <span>📋 我的清单</span>
        <span className={`font-mono text-[11px] rounded-full px-1.5 py-0.5 leading-none font-bold
          ${likeCount+maybeCount===0 ? 'bg-ink/10 text-ink' : 'bg-accent text-white'}`}>
          {likeCount + maybeCount}
        </span>
      </button>

      {openDetail && <PoiDetail poi={openDetail} onClose={()=>setOpenDetail(null)}/>}
      {openShortlist && (
        <ShortlistSheet
          pois={pois}
          decisions={decisions}
          onUpdate={updateDecision}
          onClose={()=>setOpenShortlist(false)}
          onPlan={()=>{ setOpenShortlist(false); startPlanning(); }}/>
      )}
    </div>
  );
}

function getPoiImages(poi){
  // gallery 优先，其次 cover_url；去重
  const list = [];
  (poi.gallery||[]).forEach(u=>{ if(u && !list.includes(u)) list.push(u); });
  if(poi.cover_url && !list.includes(poi.cover_url)) list.unshift(poi.cover_url);
  return list;
}

function PoiCover({poi, h='h-64', imgIdx=0, showIndicator=false}){
  const [failed,setFailed] = useState({});
  const [loaded,setLoaded] = useState({}); // url -> true 表示已经触发过 onLoad
  const meta = CAT_META[poi.category] || {label:poi.category,icon:'📍'};
  const images = getPoiImages(poi);
  const total = images.length;
  const safeIdx = total ? ((imgIdx % total) + total) % total : 0;
  const url = images[safeIdx];
  const showImage = url && !failed[url];
  const isLoading = url && !loaded[url] && !failed[url];

  // 预加载相邻图（下一张优先）
  useEffect(()=>{
    if(total<=1) return;
    const nexts = [
      images[(safeIdx+1)%total],
      images[(safeIdx-1+total)%total],
    ];
    nexts.forEach(u=>{
      if(!u || loaded[u] || failed[u]) return;
      const im = new Image();
      im.onload = ()=> setLoaded(s=> s[u] ? s : ({...s,[u]:true}));
      im.onerror = ()=> setFailed(s=> s[u] ? s : ({...s,[u]:true}));
      im.src = u;
    });
  },[safeIdx,total,url]);

  return (
    <div className={`relative ${h} overflow-hidden`} style={{background:poi.color||'#0F3D2E'}}>
      {showImage && (
        <img src={url} alt={poi.name_zh}
          key={url}
          className="absolute inset-0 w-full h-full object-cover"
          style={{opacity: loaded[url] ? 1 : 0, transition:'opacity .18s ease'}}
          loading="eager"
          decoding="async"
          onLoad={()=>setLoaded(s=>({...s,[url]:true}))}
          onError={()=>setFailed(f=>({...f, [url]:true}))}/>
      )}
      {!showImage && (
        <>
          <div className="absolute inset-0 opacity-15"
            style={{backgroundImage:'linear-gradient(rgba(255,255,255,.6) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.6) 1px,transparent 1px)',backgroundSize:'28px 28px'}}/>
          <div className="absolute -right-4 -bottom-6 text-[180px] leading-none opacity-25 select-none">{poi.icon||meta.icon}</div>
        </>
      )}
      {/* loading 兜底：图未加载完时盖一层暗色 + spinner，避免视觉残留为上一张 */}
      {isLoading && (
        <div className="absolute inset-0 flex items-center justify-center pointer-events-none z-[5]"
          style={{background:'rgba(0,0,0,0.35)', backdropFilter:'blur(2px)'}}>
          <div className="w-7 h-7 rounded-full border-2 border-white/30 border-t-white animate-spin"/>
        </div>
      )}

      {/* 顶部分段 indicator（Story 风格） */}
      {showIndicator && total > 1 && (
        <div className="absolute top-2 left-2 right-2 flex gap-1 pointer-events-none z-10">
          {images.map((_,i)=>(
            <div key={i} className="flex-1 h-[3px] rounded-full bg-white/30 overflow-hidden">
              <div className="h-full bg-white transition-all" style={{width: i===safeIdx?'100%':(i<safeIdx?'100%':'0%'), opacity: i===safeIdx?1:(i<safeIdx?0.55:0)}}/>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

/* ---------- 我的清单抽屉 ---------- */
function ShortlistSheet({pois, decisions, onUpdate, onClose, onPlan}){
  const [tab,setTab] = useState('like'); // like / maybe
  const liked = pois.filter(p=>decisions[p.id]==='like');
  const maybe = pois.filter(p=>decisions[p.id]==='maybe');
  const list = tab==='like'? liked : maybe;
  const total = liked.length + maybe.length;

  return (
    <div className="fixed inset-0 z-50 bg-black/40 backdrop-blur-sm sheet-fade" onClick={onClose}>
      <div className="absolute inset-x-0 bottom-0 bg-cream rounded-t-3xl max-h-[92vh] overflow-hidden sheet-up flex flex-col"
        onClick={(e)=>e.stopPropagation()}>
        <div className="w-10 h-1 bg-line rounded-full mx-auto mt-3 shrink-0"/>

        {/* 标题 */}
        <div className="px-5 pt-3 pb-3 shrink-0">
          <div className="flex items-baseline justify-between">
            <h3 className="font-serif text-xl font-bold">我的曼谷清单</h3>
            <button onClick={onClose} className="font-mono text-xs text-muted">收起 ↓</button>
          </div>
          <p className="text-xs text-muted mt-1">长按可调整决定 · 点卡看详情</p>
        </div>

        {/* Tabs */}
        <div className="flex gap-2 px-5 mb-2 shrink-0">
          <button onClick={()=>setTab('like')}
            className={`flex-1 py-2.5 rounded-xl border-2 transition ${tab==='like'?'bg-accent text-white border-accent shadow-md':'bg-cream border-line text-ink'}`}>
            <div className="font-serif font-bold text-sm">♥ 想去 <span className="font-mono ml-1">{liked.length}</span></div>
          </button>
          <button onClick={()=>setTab('maybe')}
            className={`flex-1 py-2.5 rounded-xl border-2 transition ${tab==='maybe'?'bg-ink text-white border-ink shadow-md':'bg-cream border-line text-ink'}`}>
            <div className="font-serif font-bold text-sm">⌛ 待定 <span className="font-mono ml-1">{maybe.length}</span></div>
          </button>
        </div>

        {/* 列表 */}
        <div className="flex-1 overflow-y-auto no-scrollbar px-5 pb-3">
          {list.length===0 ? (
            <div className="py-16 text-center text-muted text-sm">
              {tab==='like' ? '还没有"想去"的景点，去刷几张吧' : '没有待定的景点'}
            </div>
          ) : (
            <ul className="space-y-2">
              {list.map(p=>(
                <ShortlistRow key={p.id} poi={p} verb={tab}
                  onMove={(newVerb)=>onUpdate(p.id, newVerb)}
                  onRemove={()=>onUpdate(p.id, null)}/>
              ))}
            </ul>
          )}
        </div>

        {/* 底部规划按钮 */}
        <div className="p-4 border-t border-line shrink-0 bg-cream"
          style={{paddingBottom:'calc(env(safe-area-inset-bottom,0px) + 16px)'}}>
          <button onClick={onPlan} disabled={total===0}
            className={`w-full py-4 rounded-2xl font-serif font-bold text-base transition flex items-center justify-center gap-2
              ${total===0
                ? 'bg-paper text-ink/40 border-2 border-line cursor-not-allowed'
                : 'bg-ink text-white border-2 border-ink active:scale-[0.98] shadow-md'}`}>
            <span>✨ 一键规划我的行程</span>
            {total>0 && <span className="font-mono text-xs bg-accent text-white rounded-full px-2 py-0.5">{total}</span>}
          </button>
          <p className="text-[10px] text-muted text-center mt-2 font-mono">
            按天分配 · 同区域聚类 · 小时级排程
          </p>
        </div>
      </div>
    </div>
  );
}

function ShortlistRow({poi, verb, onMove, onRemove}){
  const [showOps,setShowOps] = useState(false);
  const meta = CAT_META[poi.category] || {label:poi.category,icon:'📍'};
  return (
    <li className="bg-paper border border-line rounded-xl overflow-hidden">
      <div className="flex items-stretch">
        <div className="w-20 shrink-0 relative" style={{background:poi.color||'#0F3D2E'}}>
          {poi.cover_url
            ? <img src={poi.cover_url} className="w-full h-full object-cover" loading="lazy"
                onError={(e)=>{e.currentTarget.style.display='none'}}/>
            : <div className="w-full h-full grid place-items-center text-2xl text-white/95">{poi.icon||meta.icon}</div>}
        </div>
        <div className="flex-1 p-3 min-w-0">
          <div className="flex items-center gap-1.5 flex-wrap">
            <span className="font-mono text-[10px] text-muted">{meta.icon} {meta.label}</span>
            <span className="font-mono text-[10px] text-muted">· {poi.duration_hr}h</span>
            <span className="font-mono text-[10px] text-muted">· {poi.district_zh||poi.district}</span>
          </div>
          <div className="font-serif font-bold text-sm mt-0.5 truncate">{poi.name_zh}</div>
          <div className="text-[11px] text-ink/60 line-clamp-1 mt-0.5">{poi.short_desc}</div>
        </div>
        <button onClick={()=>setShowOps(s=>!s)}
          className="shrink-0 px-3 grid place-items-center text-muted active:bg-line">
          <span className="text-base">⋯</span>
        </button>
      </div>
      {showOps && (
        <div className="border-t border-line bg-cream/60 grid grid-cols-3 divide-x divide-line">
          {verb !== 'like' && (
            <button onClick={()=>{onMove('like'); setShowOps(false);}}
              className="py-3 text-xs font-serif font-bold text-accent bg-cream active:bg-accent active:text-white">移到想去 ♥</button>
          )}
          {verb !== 'maybe' && (
            <button onClick={()=>{onMove('maybe'); setShowOps(false);}}
              className="py-3 text-xs font-serif font-bold text-ink bg-cream active:bg-ink active:text-white">移到待定 ⌛</button>
          )}
          <button onClick={()=>{onRemove(); setShowOps(false);}}
            className="py-3 text-xs font-serif font-bold text-red-600 bg-cream active:bg-red-600 active:text-white">删除</button>
        </div>
      )}
    </li>
  );
}
function InfoChip({label,value}){
  return (
    <div className="bg-paper border border-line rounded-lg px-2 py-1.5">
      <div className="font-mono text-[9px] text-muted uppercase tracking-wider">{label}</div>
      <div className="font-serif text-[13px] font-bold mt-0.5 truncate">{value}</div>
    </div>
  );
}

function PoiDetail({poi,onClose}){
  const sheetRef = useRef(null);
  const bgRef = useRef(null);
  const scrollerRef = useRef(null);
  const dragRef = useRef({active:false,startY:0,y:0});
  const [imgIdx,setImgIdx] = useState(0);
  const images = getPoiImages(poi);
  const total = images.length;

  const goPrev = (e)=>{
    e.stopPropagation();
    if(total<=1) return;
    setImgIdx(i=>(i-1+total)%total);
  };
  const goNext = (e)=>{
    e.stopPropagation();
    if(total<=1) return;
    setImgIdx(i=>(i+1)%total);
  };

  const apply = (y, withTransition=false)=>{
    const el = sheetRef.current;
    if(!el) return;
    el.style.transition = withTransition ? 'transform .26s cubic-bezier(.32,.72,.42,1)' : 'none';
    el.style.transform = `translate3d(0, ${Math.max(0,y)}px, 0)`;
    if(bgRef.current){
      const op = Math.max(0, 1 - y/500);
      bgRef.current.style.background = `rgba(0,0,0,${(0.4*op).toFixed(3)})`;
    }
  };

  const close = ()=>{
    apply(window.innerHeight, true);
    setTimeout(onClose, 220);
  };

  const onPointerDown = (e)=>{
    // 只在按到"手柄 / 顶部图"上才启用拖拽
    // 或按在内容区但内容已经滚到顶部
    const onHandle = e.target.closest && e.target.closest('[data-detail-handle]');
    const sc = scrollerRef.current;
    if(!onHandle && sc && sc.scrollTop > 0) return;
    dragRef.current = {active:true, startY:e.clientY, y:0};
  };
  const onPointerMove = (e)=>{
    const d = dragRef.current;
    if(!d.active) return;
    const dy = e.clientY - d.startY;
    if(dy < 0){ d.y = 0; apply(0); return; }
    d.y = dy;
    apply(dy);
  };
  const onPointerUp = ()=>{
    const d = dragRef.current;
    if(!d.active) return;
    d.active = false;
    if(d.y > 120) close();
    else apply(0, true);
  };

  return (
    <div ref={bgRef}
      className="fixed inset-0 z-50 sheet-fade"
      style={{background:'rgba(0,0,0,.4)'}}
      onClick={close}>
      <div ref={sheetRef}
        className="absolute inset-x-0 bottom-0 bg-cream rounded-t-3xl max-h-[92vh] overflow-hidden sheet-up flex flex-col"
        style={{touchAction:'none', willChange:'transform'}}
        onClick={(e)=>e.stopPropagation()}
        onPointerDown={onPointerDown}
        onPointerMove={onPointerMove}
        onPointerUp={onPointerUp}
        onPointerCancel={onPointerUp}>

        {/* 拖拽 handle */}
        <div data-detail-handle className="shrink-0 pt-3 pb-2">
          <div className="w-12 h-1.5 bg-line rounded-full mx-auto"/>
        </div>

        {/* 顶部大图也作拖拽区 + 支持左右点切图 */}
        <div data-detail-handle className="relative h-56 shrink-0">
          <PoiCover poi={poi} h="h-full" imgIdx={imgIdx} showIndicator={total>1}/>
          {/* 左右半屏触控区，仅多图时显示 */}
          {total>1 && (
            <>
              <button onClick={goPrev}
                className="absolute left-0 top-0 bottom-0 w-[35%] z-20 flex items-center justify-start pl-3"
                style={{background:'transparent', WebkitTapHighlightColor:'transparent'}}>
                <span className="w-9 h-9 rounded-full bg-black/35 backdrop-blur text-white grid place-items-center text-base opacity-0 hover:opacity-100">‹</span>
              </button>
              <button onClick={goNext}
                className="absolute right-0 top-0 bottom-0 w-[35%] z-20 flex items-center justify-end pr-3"
                style={{background:'transparent', WebkitTapHighlightColor:'transparent'}}>
                <span className="w-9 h-9 rounded-full bg-black/35 backdrop-blur text-white grid place-items-center text-base opacity-0 hover:opacity-100">›</span>
              </button>
            </>
          )}
          <div className="absolute inset-0 pointer-events-none"
            style={{background:'linear-gradient(180deg, rgba(0,0,0,0) 40%, rgba(0,0,0,.7) 100%)'}}/>
          <div className="absolute inset-0 flex items-end p-5 pointer-events-none">
            <div className="text-white">
              <div className="font-mono text-[10px] opacity-85 tracking-widest">{CAT_META[poi.category]?.label}</div>
              <div className="font-serif text-2xl font-bold mt-0.5" style={{textShadow:'0 2px 8px rgba(0,0,0,.5)'}}>{poi.name_zh}</div>
              {total>1 && <div className="font-mono text-[10px] opacity-70 mt-1">{imgIdx+1}/{total}</div>}
            </div>
          </div>
          <button onClick={close}
            className="absolute top-3 right-3 w-9 h-9 rounded-full bg-black/45 backdrop-blur text-white grid place-items-center text-base active:scale-95 z-30">✕</button>
        </div>

        {/* 内容可滚动区 */}
        <div ref={scrollerRef}
          className="flex-1 overflow-y-auto no-scrollbar"
          style={{overscrollBehavior:'contain', touchAction:'pan-y'}}>
          <div className="p-5 pb-10">
            <p className="text-xs text-muted font-mono">{poi.name_en}{poi.name_th ? ` · ${poi.name_th}` : ''}</p>

            <div className="grid grid-cols-2 gap-2 mt-4">
              <InfoChip label="推荐停留" value={`${poi.duration_hr} 小时`}/>
              <InfoChip label="人均" value={poi.price_thb ? `฿${poi.price_thb}` : '免费'}/>
              <InfoChip label="最佳时段" value={(poi.best_time||[]).map(t=>TIME_META[t]?.label).join(' / ')}/>
              <InfoChip label="区域" value={poi.district_zh||poi.district}/>
            </div>

            <h4 className="font-serif font-bold mt-6 mb-2">简介</h4>
            <p className="text-sm leading-relaxed text-ink/85 whitespace-pre-line">{poi.long_desc || poi.short_desc}</p>

            {poi.address && <>
              <h4 className="font-serif font-bold mt-6 mb-2">地址</h4>
              <p className="text-sm text-ink/80">{poi.address}</p>
              {poi.lat && <p className="font-mono text-[11px] text-muted mt-1">{poi.lat}, {poi.lng}</p>}
            </>}

            {poi.tips?.length>0 && <>
              <h4 className="font-serif font-bold mt-6 mb-2">贴士</h4>
              <ul className="space-y-1.5">
                {poi.tips.map((t,i)=>(
                  <li key={i} className="text-sm text-ink/85 pl-5 relative before:content-['·'] before:absolute before:left-1 before:text-accent before:font-bold">{t}</li>
                ))}
              </ul>
            </>}

            <div className="flex flex-wrap gap-1.5 mt-6">
              {(poi.tags||[]).map(t=>(
                <span key={t} className="px-2.5 py-1 bg-paper rounded-full text-xs text-ink/70 border border-line">#{t}</span>
              ))}
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ---------- STEP 2.5: 预处理（超量时才进，让用户增删替换） ---------- */
function StepPreCheck({intake, liked, maybe, allPois, onDone}){
  const [items,setItems] = useState(()=>liked.slice()); // 当前 liked
  const [maybes,setMaybes] = useState(()=>maybe.slice()); // 当前 maybe
  const [replaceFor,setReplaceFor] = useState(null); // {poi, mode:'same'|'free'}
  const [adding,setAdding] = useState(false);

  const paceUpper = intake.pace === 'chill' ? 4 : (intake.pace === 'intense' ? 8 : 6);
  const upper = paceUpper * intake.days;
  const overflow = items.length - upper;

  // 按品类分组
  const groups = useMemo(()=>{
    const g = {};
    items.forEach(p=>{
      const k = p.category || 'other';
      if(!g[k]) g[k] = [];
      g[k].push(p);
    });
    // 排序：地标优先 → 食 → 其他
    const order = ['landmark','restaurant','streetfood','market','mall','cafe','nightlife','spa','art','family','hidden'];
    return Object.entries(g).sort((a,b)=>{
      const ia = order.indexOf(a[0]); const ib = order.indexOf(b[0]);
      return (ia<0?99:ia) - (ib<0?99:ib);
    });
  }, [items]);

  const removeItem = (id)=>setItems(prev=>prev.filter(p=>p.id!==id));
  const promoteMaybe = (poi)=>{
    setMaybes(prev=>prev.filter(p=>p.id!==poi.id));
    setItems(prev=>prev.find(p=>p.id===poi.id) ? prev : [...prev,poi]);
  };
  const removeMaybe = (id)=>setMaybes(prev=>prev.filter(p=>p.id!==id));

  const doReplace = (oldPoi, newPoi)=>{
    setItems(prev=>prev.map(p=>p.id===oldPoi.id ? newPoi : p));
    setReplaceFor(null);
  };
  const doAdd = (poi)=>{
    setItems(prev=>prev.find(p=>p.id===poi.id) ? prev : [...prev,poi]);
    setMaybes(prev=>prev.filter(p=>p.id!==poi.id)); // 如果是 maybe 升级，从 maybe 移走
  };

  // 已选/maybe 的 id 集合，添加抽屉里要排除掉
  const selectedIds = new Set([...items.map(p=>p.id)]);

  return (
    <div className="max-w-xl mx-auto px-5 pt-4 pb-32">
      <div className="mb-4">
        <div className="font-mono text-[11px] text-accent tracking-widest mb-1">// 03 PRE-CHECK</div>
        <h2 className="font-serif text-2xl font-bold">确认你的清单</h2>
        <p className="text-xs text-muted mt-1.5">同类放一起，方便对比和取舍。删掉不想去的，或换成更想去的。</p>
      </div>

      {/* 摘要 */}
      <div className={`rounded-2xl p-4 mb-4 border-2 ${overflow>0?'bg-[#FFF3E0] border-accent':'bg-paper border-line'}`}>
        <div className="flex items-center justify-between">
          <div>
            <div className="font-serif text-lg font-bold">{items.length} <span className="text-sm font-normal text-muted">个想去 · {intake.days} 天</span></div>
            <div className="font-mono text-[11px] text-muted mt-1">建议总量：{upper} 个（每天 ≈ {paceUpper}）</div>
          </div>
          {overflow>0 ? (
            <div className="text-right">
              <div className="text-accent font-bold text-lg">⚠️ 超 {overflow} 个</div>
              <div className="font-mono text-[10px] text-muted">建议砍到 {upper}</div>
            </div>
          ) : overflow===0 ? (
            <div className="text-[#0F3D2E] font-mono text-xs font-bold">✅ 刚好</div>
          ) : (
            <div className="text-muted font-mono text-xs">还能加 {-overflow} 个</div>
          )}
        </div>
      </div>

      {/* 按品类分组 */}
      {groups.map(([cat,arr])=>{
        const meta = CAT_META[cat] || {label:cat, icon:'📍'};
        return (
          <div key={cat} className="mb-4">
            <div className="flex items-center gap-2 mb-2">
              <span className="text-base">{meta.icon}</span>
              <span className="font-serif font-bold text-sm">{meta.label}</span>
              <span className="font-mono text-[11px] text-muted">{arr.length}</span>
            </div>
            <div className="space-y-2">
              {arr.map(p=>(
                <div key={p.id} className="bg-cream rounded-xl border border-line p-3 flex gap-3 items-center">
                  <div className="w-12 h-12 rounded-lg shrink-0 overflow-hidden" style={{background:p.color||'#0F3D2E'}}>
                    {p.cover_url
                      ? <img src={p.cover_url} className="w-full h-full object-cover" loading="lazy"/>
                      : <div className="w-full h-full grid place-items-center text-xl text-white/95">{p.icon||meta.icon}</div>}
                  </div>
                  <div className="flex-1 min-w-0">
                    <div className="font-serif font-bold text-sm truncate">{p.name_zh}</div>
                    <div className="text-[11px] text-muted truncate">{p.district_zh||p.district} · {p.duration_hr}h</div>
                  </div>
                  <button onClick={()=>setReplaceFor({poi:p, mode:'same'})}
                    className="font-mono text-[10px] px-2.5 py-1.5 rounded-md bg-paper border border-line text-ink shrink-0">🔁 换</button>
                  <button onClick={()=>removeItem(p.id)}
                    className="font-mono text-[10px] px-2.5 py-1.5 rounded-md bg-paper border border-line text-muted shrink-0">🗑</button>
                </div>
              ))}
            </div>
          </div>
        );
      })}

      {items.length===0 && (
        <div className="py-10 text-center text-muted text-sm">空了，加点东西吧 ↓</div>
      )}

      {/* 添加按钮 */}
      <button onClick={()=>setAdding(true)}
        className="w-full py-3 rounded-xl border-2 border-dashed border-line text-muted text-sm hover:bg-paper">+ 添加更多 POI</button>

      {/* Maybe 区 */}
      {maybes.length>0 && (
        <div className="mt-6 p-4 bg-paper border border-dashed border-line rounded-2xl">
          <div className="flex items-center justify-between mb-3">
            <div>
              <div className="font-serif font-bold text-sm">⏳ 待定区</div>
              <div className="font-mono text-[10px] text-muted">{maybes.length} 个你下滑了的，可一键升级</div>
            </div>
          </div>
          <div className="space-y-1.5">
            {maybes.map(p=>{
              const meta = CAT_META[p.category]||{icon:'📍',label:p.category};
              return (
                <div key={p.id} className="flex items-center gap-2 bg-cream rounded-lg px-3 py-2">
                  <span className="text-sm shrink-0">{meta.icon}</span>
                  <span className="text-[13px] font-serif font-bold flex-1 truncate">{p.name_zh}</span>
                  <button onClick={()=>promoteMaybe(p)}
                    className="font-mono text-[10px] px-2 py-1 rounded-md bg-accent text-white">↑ 加进去</button>
                  <button onClick={()=>removeMaybe(p.id)}
                    className="font-mono text-[10px] px-2 py-1 rounded-md text-muted">🗑</button>
                </div>
              );
            })}
          </div>
        </div>
      )}

      {/* 底部固定下一步 */}
      <div className="fixed bottom-0 left-0 right-0 bg-cream border-t border-line p-3" style={{paddingBottom:'calc(env(safe-area-inset-bottom,0) + 12px)'}}>
        <div className="max-w-xl mx-auto flex items-center gap-3">
          <div className="flex-1 text-xs">
            <div className="font-serif font-bold">{items.length} 个 · {intake.days} 天</div>
            {overflow>0 && <div className="text-accent font-mono text-[10px]">建议再砍 {overflow} 个</div>}
          </div>
          <button onClick={()=>onDone(items, maybes)}
            disabled={items.length===0}
            className="px-6 py-3 btn-primary rounded-xl font-serif font-bold text-sm disabled:opacity-40">
            下一步：生成行程 →
          </button>
        </div>
      </div>

      {/* 替换抽屉 */}
      {replaceFor && (
        <ReplaceDrawer
          old={replaceFor.poi}
          mode={replaceFor.mode}
          allPois={allPois}
          excludeIds={selectedIds}
          onClose={()=>setReplaceFor(null)}
          onPick={(newPoi)=>doReplace(replaceFor.poi, newPoi)}
          onSwitchMode={(m)=>setReplaceFor(prev=>({...prev,mode:m}))}/>
      )}

      {/* 添加抽屉 */}
      {adding && (
        <AddDrawer
          allPois={allPois}
          excludeIds={selectedIds}
          onClose={()=>setAdding(false)}
          onPick={(p)=>{ doAdd(p); setAdding(false); }}/>
      )}
    </div>
  );
}

/* ---------- 替换抽屉 ---------- */
function ReplaceDrawer({old, mode, allPois, excludeIds, onClose, onPick, onSwitchMode}){
  const meta = CAT_META[old.category]||{icon:'📍',label:old.category};
  const candidates = useMemo(()=>{
    let pool = allPois.filter(p => p.id !== old.id && !excludeIds.has(p.id));
    if(mode === 'same'){
      pool = pool.filter(p => p.category === old.category);
    }
    // 按热度排
    return pool.sort((a,b)=>(b.popularity||0)-(a.popularity||0)).slice(0,30);
  }, [old, mode, allPois]);

  return (
    <div onClick={onClose} style={{position:'fixed',inset:0,background:'rgba(15,61,46,.55)',zIndex:9000,display:'flex',alignItems:'flex-end'}}>
      <div onClick={e=>e.stopPropagation()}
        className="bg-cream w-full max-w-xl mx-auto rounded-t-3xl"
        style={{maxHeight:'82vh',overflowY:'auto',paddingBottom:'env(safe-area-inset-bottom,0)'}}>
        <div className="sticky top-0 bg-cream border-b border-line p-4 z-10">
          <div className="flex items-center gap-2 mb-2">
            <span className="text-base">{meta.icon}</span>
            <span className="font-serif font-bold text-sm">替换《{old.name_zh}》</span>
            <span className="flex-1"/>
            <button onClick={onClose} className="text-2xl text-muted leading-none">×</button>
          </div>
          <div className="flex gap-2">
            <button onClick={()=>onSwitchMode('same')}
              className={`flex-1 py-1.5 rounded-md font-mono text-[11px] border ${mode==='same'?'bg-ink text-white border-ink':'bg-paper text-ink border-line'}`}>
              同类（{meta.label}）
            </button>
            <button onClick={()=>onSwitchMode('free')}
              className={`flex-1 py-1.5 rounded-md font-mono text-[11px] border ${mode==='free'?'bg-ink text-white border-ink':'bg-paper text-ink border-line'}`}>
              🔧 自由编辑（任意品类）
            </button>
          </div>
        </div>
        <div className="p-3 space-y-2">
          {candidates.map(p=>{
            const m2 = CAT_META[p.category]||{icon:'📍',label:p.category};
            return (
              <button key={p.id} onClick={()=>onPick(p)}
                className="w-full bg-paper rounded-xl border border-line p-3 flex gap-3 items-center text-left hover:bg-white">
                <div className="w-12 h-12 rounded-lg shrink-0 overflow-hidden" style={{background:p.color||'#0F3D2E'}}>
                  {p.cover_url
                    ? <img src={p.cover_url} className="w-full h-full object-cover" loading="lazy"/>
                    : <div className="w-full h-full grid place-items-center text-xl text-white/95">{p.icon||m2.icon}</div>}
                </div>
                <div className="flex-1 min-w-0">
                  <div className="font-serif font-bold text-sm truncate">{p.name_zh}</div>
                  <div className="text-[11px] text-muted truncate">
                    <span className="font-mono">{m2.icon} {m2.label}</span> · {p.district_zh||p.district}
                    {p.popularity ? <span className="text-accent ml-1.5">🔥{p.popularity}</span> : null}
                  </div>
                </div>
              </button>
            );
          })}
          {candidates.length===0 && (
            <div className="py-10 text-center text-muted text-sm">暂无可替换的（{mode==='same'?'同类没有备选了，试试自由编辑':'已经全选完了'}）</div>
          )}
        </div>
      </div>
    </div>
  );
}

/* ---------- 添加抽屉 ---------- */
function AddDrawer({allPois, excludeIds, onClose, onPick}){
  const [filter,setFilter] = useState('all');
  const cats = useMemo(()=>{
    const set = new Set(allPois.map(p=>p.category));
    return ['all', ...Array.from(set)];
  }, [allPois]);
  const candidates = useMemo(()=>{
    let pool = allPois.filter(p=>!excludeIds.has(p.id));
    if(filter !== 'all') pool = pool.filter(p=>p.category===filter);
    return pool.sort((a,b)=>(b.popularity||0)-(a.popularity||0));
  }, [allPois, filter]);

  return (
    <div onClick={onClose} style={{position:'fixed',inset:0,background:'rgba(15,61,46,.55)',zIndex:9000,display:'flex',alignItems:'flex-end'}}>
      <div onClick={e=>e.stopPropagation()}
        className="bg-cream w-full max-w-xl mx-auto rounded-t-3xl"
        style={{maxHeight:'82vh',overflowY:'auto',paddingBottom:'env(safe-area-inset-bottom,0)'}}>
        <div className="sticky top-0 bg-cream border-b border-line p-4 z-10">
          <div className="flex items-center gap-2 mb-3">
            <span className="font-serif font-bold text-sm">➕ 添加 POI</span>
            <span className="flex-1"/>
            <button onClick={onClose} className="text-2xl text-muted leading-none">×</button>
          </div>
          <div className="flex gap-1.5 overflow-x-auto no-scrollbar">
            {cats.map(c=>{
              const m = c==='all' ? {icon:'🌐',label:'全部'} : (CAT_META[c]||{icon:'📍',label:c});
              return (
                <button key={c} onClick={()=>setFilter(c)}
                  className={`shrink-0 px-3 py-1.5 rounded-full font-mono text-[11px] border ${filter===c?'bg-ink text-white border-ink':'bg-paper text-ink border-line'}`}>
                  {m.icon} {m.label}
                </button>
              );
            })}
          </div>
        </div>
        <div className="p-3 space-y-2">
          {candidates.map(p=>{
            const m2 = CAT_META[p.category]||{icon:'📍',label:p.category};
            return (
              <button key={p.id} onClick={()=>onPick(p)}
                className="w-full bg-paper rounded-xl border border-line p-3 flex gap-3 items-center text-left hover:bg-white">
                <div className="w-12 h-12 rounded-lg shrink-0 overflow-hidden" style={{background:p.color||'#0F3D2E'}}>
                  {p.cover_url
                    ? <img src={p.cover_url} className="w-full h-full object-cover" loading="lazy"/>
                    : <div className="w-full h-full grid place-items-center text-xl text-white/95">{p.icon||m2.icon}</div>}
                </div>
                <div className="flex-1 min-w-0">
                  <div className="font-serif font-bold text-sm truncate">{p.name_zh}</div>
                  <div className="text-[11px] text-muted truncate">
                    <span className="font-mono">{m2.icon} {m2.label}</span> · {p.district_zh||p.district}
                    {p.popularity ? <span className="text-accent ml-1.5">🔥{p.popularity}</span> : null}
                  </div>
                </div>
                <span className="font-mono text-[11px] text-accent">+ 加</span>
              </button>
            );
          })}
        </div>
      </div>
    </div>
  );
}

/* ---------- STEP 2: 行程清单 ---------- */
function StepItinerary({intake,liked,maybe,onRestart,allPois}){
  const [loading,setLoading] = useState(true);
  const [err,setErr] = useState(null);
  const [result,setResult] = useState(null); // {days:[], overallTip:""}
  const [tab,setTab] = useState(0);
  const [done,setDone] = useState({});
  const [picker,setPicker] = useState(null); // {dayIdx, blockIdx, block} | null
  const [saving,setSaving] = useState(false);
  const [savedImageUrl,setSavedImageUrl] = useState(null); // 移动端用 modal 让用户长按保存
  const itineraryRef = React.useRef(null);

  const runAI = async ()=>{
    setLoading(true); setErr(null);
    try {
      const r = await aiBuildItinerary(liked, maybe, intake);
      setResult(r);
      setTab(0);
      setDone({});
    } catch(e){
      console.error(e);
      setErr(e.message || String(e));
    } finally {
      setLoading(false);
    }
  };

  // —— Step 4 编辑能力：删 / 加 / 移到别天 ——
  const removePoiFromDay = (dayIdx, poiId)=>{
    if(!confirm('从行程中移除这个景点？')) return;
    setResult(prev=>{
      if(!prev) return prev;
      return {...prev, days: prev.days.map((d,i)=>{
        if(i!==dayIdx) return d;
        return {...d, timeline: d.timeline.filter(b => !(b.type==='poi' && b.poi.id===poiId))};
      })};
    });
  };
  const movePoiToDay = (fromIdx, toIdx, poiId)=>{
    setResult(prev=>{
      if(!prev) return prev;
      let block = null;
      const days = prev.days.map((d,i)=>{
        if(i!==fromIdx) return d;
        return {...d, timeline: d.timeline.filter(b=>{
          if(b.type==='poi' && b.poi.id===poiId){ block = b; return false; }
          return true;
        })};
      });
      if(!block) return prev;
      // 简单插到目标天末尾，时间不重排（用户后续可点 AI 重排）
      const days2 = days.map((d,i)=> i===toIdx ? {...d, timeline:[...d.timeline, block]} : d);
      return {...prev, days: days2};
    });
  };
  const [addingTo, setAddingTo] = useState(null); // dayIdx | null
  const addPoiToDay = (dayIdx, poi)=>{
    setResult(prev=>{
      if(!prev) return prev;
      const block = {type:'poi', poi, start:'12:00', end:'14:00', note:'手动添加 · 点 ↻ AI 重排可优化时间'};
      return {...prev, days: prev.days.map((d,i)=> i===dayIdx ? {...d, timeline:[...d.timeline, block]} : d)};
    });
    setAddingTo(null);
  };

  // 用户在抽屉里选了某个餐厅 / 手动添加 / 清除
  const applyMealChoice = (chosenPoi)=>{
    if(!picker) return;
    setResult(prev=>{
      if(!prev) return prev;
      const days = prev.days.map((d,di)=>{
        if(di !== picker.dayIdx) return d;
        return {
          ...d,
          timeline: d.timeline.map((b,bi)=>{
            if(bi !== picker.blockIdx) return b;
            if(b.type !== 'meal_placeholder') return b;
            return {...b, user_chosen_poi: chosenPoi};
          }),
        };
      });
      return {...prev, days};
    });
    setPicker(null);
  };

  // 「保存为图片」：把整个行程节点连同所有 day 的 timeline 一次性渲染成长图
  const saveAsImage = async ()=>{
    if(saving) return;
    if(!itineraryRef.current){ alert('页面尚未准备好'); return; }
    if(typeof html2canvas !== 'function' || typeof QRCode === 'undefined'){
      alert('图片库还没加载完，稍后再试'); return;
    }
    setSaving(true);
    try {
      // 1. 等中文字体加载完
      if(document.fonts && document.fonts.ready) await document.fonts.ready;

      // 2. 在原节点上克隆一份用于渲染（避免影响 UI；切到"全部 day 平铺"模式）
      const clone = itineraryRef.current.cloneNode(true);
      const sandbox = document.createElement('div');
      sandbox.style.cssText = 'position:fixed;left:-99999px;top:0;width:750px;background:#FAF8F2;padding:20px;';
      // 把克隆里的"切换 tab"块隐掉（克隆只能渲染当前 tab）
      sandbox.appendChild(clone);
      document.body.appendChild(sandbox);

      // 3. 在底部追加分享底栏（含二维码）
      const url = 'https://falvatore3.github.io/swipego/?utm_source=share_image&utm_medium=xhs&utm_campaign=v2';
      const qrDataUrl = await QRCode.toDataURL(url, {
        margin: 1, width: 240,
        color: { dark: '#0F3D2E', light: '#FFFFFF' },
        errorCorrectionLevel: 'M',
      });
      const totalPois = (result?.days||[]).reduce((s,d)=>s+d.timeline.filter(b=>b.type==='poi').length, 0);
      const totalMeals = (result?.days||[]).reduce((s,d)=>s+d.timeline.filter(b=>b.type==='meal_placeholder').length, 0);
      const footer = document.createElement('div');
      footer.style.cssText = 'margin-top:24px;padding:20px;background:#0F3D2E;color:#fff;border-radius:20px;display:flex;justify-content:space-between;align-items:center;font-family:ui-serif,serif;';
      footer.innerHTML = `
        <div style="flex:1;min-width:0">
          <div style="font-size:18px;font-weight:bold;">✨ SwipeGo · 滑卡定制曼谷 ${intake.days} 日游</div>
          <div style="font-size:12px;opacity:.85;margin-top:6px;">${intake.days} 天 · ${totalPois} 个景点 · ${totalMeals} 个餐位待你选</div>
          <div style="font-size:11px;opacity:.7;margin-top:10px;font-family:ui-monospace,monospace;">扫码定制你的专属行程 →</div>
        </div>
        <div style="background:#fff;padding:6px;border-radius:10px;margin-left:14px;">
          <img src="${qrDataUrl}" style="width:96px;height:96px;display:block;"/>
        </div>
      `;
      sandbox.appendChild(footer);

      // 4. 渲染
      const canvas = await html2canvas(sandbox, {
        useCORS: true,
        backgroundColor: '#FAF8F2',
        scale: 2,
        logging: false,
      });

      // 5. 清理 sandbox
      document.body.removeChild(sandbox);

      // 6. 下载 / 移动端展示
      const dataUrl = canvas.toDataURL('image/png');
      const isMobile = /iPhone|iPad|Android/i.test(navigator.userAgent);
      if(isMobile){
        setSavedImageUrl(dataUrl);  // 弹 modal 让用户长按保存
      } else {
        const a = document.createElement('a');
        a.href = dataUrl;
        a.download = `swipego-bangkok-${intake.days}d.png`;
        document.body.appendChild(a); a.click(); a.remove();
      }
    } catch(e) {
      console.error(e);
      alert('保存图片失败：' + (e.message || e));
    } finally {
      setSaving(false);
    }
  };

  useEffect(()=>{ runAI(); }, []); // 进入页面立刻调

  if(loading) return <ItineraryLoading liked={liked} days={intake.days}/>;
  if(err) return <ItineraryError err={err} onRetry={runAI} onBack={onRestart}/>;
  // 防御：result 缺失或 days 为空都给一个明确的空态，避免白屏
  if(!result || !Array.isArray(result.days) || result.days.length === 0){
    return <ItineraryError
      err={result ? '行程数据为空（AI 没排出任何天，可能是输入太少）' : '行程结果丢失，请重试'}
      onRetry={runAI} onBack={onRestart}/>;
  }

  const itinerary = result.days;
  // 兼容统计：只统计 poi 类型的 block
  const poiBlocks = itinerary.flatMap(d => d.timeline.filter(b => b.type === 'poi'));
  const totalItems = poiBlocks.length;
  const doneCount = Object.keys(done).filter(k=>done[k]).length;
  const day = itinerary[tab];

  return (
    <div className="max-w-xl mx-auto px-5 pt-4 pb-24">
      <div className="mb-5">
        <div className="font-mono text-[11px] text-accent tracking-widest mb-1">// 03 ITINERARY · AI</div>
        <div className="flex items-end justify-between">
          <h2 className="font-serif text-2xl font-bold">你的曼谷行程</h2>
          <div className="flex gap-3 items-center">
            <button onClick={saveAsImage} disabled={saving}
              className="font-mono text-[11px] px-2.5 py-1 rounded-md bg-accent text-white disabled:opacity-50">
              {saving ? '⏳ 生成中…' : '💾 保存为图片'}
            </button>
            <button onClick={runAI} className="font-mono text-[11px] text-ink underline underline-offset-2">↻ AI 重排</button>
          </div>
        </div>
        <p className="text-xs text-muted mt-1">{intake.days} 天 · {liked.length} 个想去{maybe.length>0?` · ${maybe.length} 待定`:''} · ✨ DeepSeek 生成</p>
      </div>

      {/* 截图区域开始（保存为图片用） */}
      <div ref={itineraryRef}>

      {/* AI 整体建议 */}
      {result.overallTip && (
        <div className="bg-paper border border-accent/30 rounded-2xl p-4 mb-5">
          <div className="flex items-start gap-2">
            <span className="text-base shrink-0">✨</span>
            <div className="flex-1">
              <div className="font-mono text-[10px] text-accent tracking-widest mb-1">AI 旅行贴士</div>
              <p className="text-[13px] text-ink/85 leading-relaxed">{result.overallTip}</p>
            </div>
          </div>
        </div>
      )}

      {/* 总进度 */}
      <div className="bg-paper border border-line rounded-2xl p-4 mb-5">
        <div className="flex items-center justify-between mb-2">
          <span className="font-serif font-bold text-sm">总进度</span>
          <span className="font-mono text-sm"><span className="text-ink font-bold">{doneCount}</span><span className="text-muted"> / {totalItems}</span></span>
        </div>
        <div className="h-2 bg-cream rounded-full overflow-hidden">
          <div className="h-full bg-accent transition-all" style={{width:`${totalItems?(doneCount/totalItems)*100:0}%`}}/>
        </div>
      </div>

      {/* Day Tabs */}
      <div className="flex gap-2 overflow-x-auto no-scrollbar mb-5 pb-1">
        {itinerary.map((d,i)=>{
          const active = i===tab;
          const dPoiBlocks = d.timeline.filter(b => b.type === 'poi');
          const dCount = dPoiBlocks.filter(b => done[b.poi.id]).length;
          return (
            <button key={i} onClick={()=>setTab(i)}
              className={`shrink-0 px-4 py-2.5 rounded-xl border-2 transition text-left min-w-[88px] ${active?'bg-ink text-white border-ink shadow-md':'bg-cream border-line text-ink'}`}>
              <div className="font-mono text-[10px] opacity-70">DAY {i+1}</div>
              <div className="font-serif font-bold text-sm leading-tight mt-0.5 line-clamp-1">{d.theme}</div>
              <div className="font-mono text-[10px] mt-1 opacity-70">{dCount}/{dPoiBlocks.length}</div>
            </button>
          );
        })}
      </div>

      {/* 当日 theme（醒目卡） */}
      {day && (
        <div className="bg-ink text-white rounded-2xl p-4 mb-4">
          <div className="font-mono text-[10px] opacity-70 tracking-widest">DAY {tab+1} · {day.timeline.filter(b=>b.type==='poi').length} 项 · {day.timeline.filter(b=>b.type==='meal_placeholder').length} 餐位</div>
          <div className="font-serif text-xl font-bold mt-1">{day.theme}</div>
        </div>
      )}

      {/* 当天的时间轴 */}
      <div className="relative">
        <div className="absolute left-4 top-4 bottom-4 w-px bg-line"/>
        <div className="space-y-3">
          {day && day.timeline.map((b,i)=>{
            if(b.type === 'poi'){
              return (
                <TimelineItem key={i} item={b} checked={!!done[b.poi.id]}
                  onToggle={()=>setDone(prev=>({...prev,[b.poi.id]:!prev[b.poi.id]}))}
                  onRemove={()=>removePoiFromDay(tab, b.poi.id)}
                  onMove={(toIdx)=>movePoiToDay(tab, toIdx, b.poi.id)}
                  totalDays={itinerary.length}
                  currentDayIdx={tab}/>
              );
            }
            if(b.type === 'meal_placeholder'){
              return (
                <MealPlaceholder key={i} block={b}
                  onPick={()=>setPicker({dayIdx: tab, blockIdx: i, block: b})}/>
              );
            }
            return null;
          })}
          {day && day.timeline.length===0 && (
            <div className="py-10 text-center text-muted text-sm">这一天空着，可以加点什么 ↓</div>
          )}
          {/* + 添加 POI 到这一天 */}
          {day && (
            <button onClick={()=>setAddingTo(tab)}
              className="w-full py-3 ml-10 rounded-xl border-2 border-dashed border-line text-muted text-xs hover:bg-paper">
              + 加一个 POI 到 Day {tab+1}
            </button>
          )}
        </div>
      </div>

      {/* Step 4 添加抽屉 */}
      {addingTo!==null && (
        <AddDrawer
          allPois={allPois || []}
          excludeIds={new Set(itinerary.flatMap(d=>d.timeline.filter(b=>b.type==='poi').map(b=>b.poi.id)))}
          onClose={()=>setAddingTo(null)}
          onPick={(p)=>addPoiToDay(addingTo, p)}/>
      )}

      {/* 截图区域结束 */}
      </div>

      {maybe.length>0 && (
        <div className="mt-8 p-4 bg-paper border border-dashed border-line rounded-2xl">
          <div className="flex items-center justify-between mb-2">
            <span className="font-serif font-bold text-sm">待定清单</span>
            <span className="font-mono text-[11px] text-muted">{maybe.length} 项</span>
          </div>
          <div className="flex flex-wrap gap-1.5">
            {maybe.map(p=>(
              <span key={p.id} className="px-2.5 py-1 bg-cream rounded-full text-[11px] border border-line">{p.name_zh}</span>
            ))}
          </div>
        </div>
      )}

      <button onClick={onRestart} className="mt-8 w-full py-3 rounded-xl border border-line text-sm text-muted">重新开始</button>

      <p className="font-mono text-[10px] text-muted text-center mt-6 tracking-wider">MADE WITH SWIPEGO · ✨ AI by DeepSeek</p>

      {/* 餐厅选择抽屉 */}
      {picker && (
        <MealPicker
          block={picker.block}
          allPois={allPois || []}
          onClose={()=>setPicker(null)}
          onChoose={applyMealChoice}
          onClear={()=>applyMealChoice(null)}/>
      )}

      {/* 移动端图片保存 modal */}
      {savedImageUrl && (
        <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm sheet-fade flex flex-col" onClick={()=>setSavedImageUrl(null)}>
          <div className="flex-1 overflow-y-auto p-5" onClick={(e)=>e.stopPropagation()}>
            <div className="max-w-md mx-auto">
              <div className="bg-cream rounded-t-2xl px-4 py-3 flex justify-between items-center">
                <span className="font-serif font-bold text-sm">长按下图保存到相册 📥</span>
                <button onClick={()=>setSavedImageUrl(null)} className="font-mono text-xs text-muted">关闭 ✕</button>
              </div>
              <img src={savedImageUrl} alt="行程图" className="w-full block"/>
              <p className="text-center text-xs text-white/80 mt-3">保存后发到小红书 → 别人扫码就能进 SwipeGo 🚀</p>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ---------- AI 加载态 ---------- */
function ItineraryLoading({liked, days}){
  const [step,setStep] = useState(0);
  const [elapsed,setElapsed] = useState(0);  // 已等待秒数，给用户"它没死"的反馈
  const phases = [
    `分析你选的 ${liked.length} 个景点`,
    "按地理位置聚类...",
    "匹配每个景点的最佳时段...",
    `排出 ${days} 天小时级清单...`,
    "撰写每日主题与贴士...",
  ];
  useEffect(()=>{
    const t1 = setInterval(()=>setStep(s=>(s+1)%phases.length), 1400);
    const t2 = setInterval(()=>setElapsed(s=>s+1), 1000);
    return ()=>{ clearInterval(t1); clearInterval(t2); };
  },[]);
  const slow = elapsed > 20;  // >20s 提示用户它没卡死
  return (
    <div className="max-w-xl mx-auto px-5 pt-12 pb-20 text-center">
      <div className="text-6xl mb-5 select-none animate-pulse">✨</div>
      <div className="font-mono text-[11px] text-accent tracking-widest mb-2">AI GENERATING</div>
      <h2 className="font-serif text-2xl font-bold">DeepSeek 正在为你排程</h2>
      <p className="text-sm text-muted mt-3">通常需要 5-15 秒 · 已等待 <span className="font-mono text-ink font-bold">{elapsed}s</span></p>
      {slow && (
        <p className="text-[11px] text-accent mt-2 font-mono">⏳ 模型正在思考长上下文，再等等...</p>
      )}
      <div className="mt-10 space-y-2">
        {phases.map((p,i)=>(
          <div key={i} className={`flex items-center gap-3 transition ${i<=step?'opacity-100':'opacity-30'}`}>
            <div className={`w-2 h-2 rounded-full ${i<step?'bg-accent':i===step?'bg-ink animate-pulse':'bg-line'}`}/>
            <span className={`text-[13px] font-mono ${i===step?'text-ink font-bold':'text-muted'}`}>{p}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ---------- AI 失败态 ---------- */
function ItineraryError({err, onRetry, onBack}){
  return (
    <div className="max-w-xl mx-auto px-5 pt-16 pb-10 text-center">
      <div className="text-5xl mb-4">😢</div>
      <h2 className="font-serif text-2xl font-bold">AI 暂时罢工了</h2>
      <p className="text-sm text-muted mt-2">网络或服务问题，再试一次通常就好</p>
      <div className="mt-4 p-3 bg-paper border border-line rounded-xl text-[11px] font-mono text-ink/70 text-left break-all">
        {err}
      </div>
      <div className="flex gap-3 mt-8">
        <button onClick={onBack} className="flex-1 py-3 rounded-xl border border-line text-sm text-ink">回去重选</button>
        <button onClick={onRetry} className="flex-1 py-3 rounded-xl bg-ink text-white border-2 border-ink font-bold text-sm shadow-md">重试 AI ↻</button>
      </div>
    </div>
  );
}

function TimelineItem({item,checked,onToggle,onRemove,onMove,totalDays,currentDayIdx}){
  const {poi,start,end,note} = item;
  const meta = CAT_META[poi.category];
  const [menuOpen,setMenuOpen] = useState(false);
  return (
    <div className="relative pl-10">
      <div className="absolute left-[13px] top-4 w-2.5 h-2.5 rounded-full border-2 border-ink bg-cream"/>
      <div className={`rounded-2xl border transition ${checked?'bg-paper border-accent/40':'bg-cream border-line card-shadow'}`}>
        <div className="flex">
          <div className="w-20 shrink-0 bg-ink text-white p-3 rounded-l-2xl flex flex-col items-center justify-center">
            <div className="font-mono text-[10px] opacity-80">{start}</div>
            <div className="font-serif font-bold text-xs">↓</div>
            <div className="font-mono text-[10px] opacity-80">{end}</div>
          </div>
          <div className="flex-1 p-3 flex gap-3 items-start">
            <div className="w-14 h-14 rounded-lg shrink-0 overflow-hidden relative" style={{background:poi.color||'#0F3D2E'}}>
              {poi.cover_url
                ? <img src={poi.cover_url} className="w-full h-full object-cover" loading="lazy"
                    onError={(e)=>{e.currentTarget.style.display='none'}}/>
                : <div className="w-full h-full grid place-items-center text-2xl text-white/95">{poi.icon||meta?.icon||'📍'}</div>}
            </div>
            <div className="flex-1 min-w-0">
              <div className="flex items-center gap-1.5 flex-wrap">
                <span className="font-mono text-[10px] text-muted">{meta?.icon} {meta?.label}</span>
                <span className="font-mono text-[10px] text-muted">· {poi.duration_hr}h</span>
              </div>
              <div className={`font-serif font-bold text-sm mt-0.5 truncate ${checked?'line-through text-muted':'text-ink'}`}>{poi.name_zh}</div>
              <div className="text-[11px] text-muted truncate">{poi.district_zh||poi.district}</div>
            </div>
            <div className="flex flex-col gap-1.5 items-end shrink-0">
              <button onClick={onToggle}
                className={`w-7 h-7 rounded-md border-2 grid place-items-center transition ${checked?'bg-accent border-accent text-white':'border-ink bg-cream hover:bg-paper'}`}>
                {checked && <span className="tick-in text-sm">✓</span>}
              </button>
              {/* 编辑菜单 */}
              <div className="relative">
                <button onClick={()=>setMenuOpen(o=>!o)}
                  className="w-7 h-7 rounded-md border border-line text-muted text-sm leading-none">⋯</button>
                {menuOpen && (
                  <>
                    <div onClick={()=>setMenuOpen(false)} style={{position:'fixed',inset:0,zIndex:50}}/>
                    <div className="absolute right-0 top-8 bg-cream border border-line rounded-lg shadow-lg z-[60] py-1 min-w-[120px]">
                      {totalDays>1 && Array.from({length:totalDays}).map((_,d)=>{
                        if(d===currentDayIdx) return null;
                        return (
                          <button key={d} onClick={()=>{onMove&&onMove(d);setMenuOpen(false);}}
